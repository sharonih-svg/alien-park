<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Alien Park - דוידי 🛸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    position: fixed;
    width: 100%;
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sky-bg { background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 40%, #7dd3fc 100%); }
  .start-bg { background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 50%, #bae6fd 100%); }
  .gameover-bg { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); }
  #score-display {
    font-family: 'Bungee', Impact, sans-serif;
    font-size: 2.2rem;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .star-icon { color: #fde047; font-size: 1.6rem; }
  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    cursor: crosshair;
  }
  .controls-hint {
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
    color: white; opacity: 0.7; margin-top: 10px; font-size: 0.9rem;
    display: flex; gap: 24px;
  }
  .screen-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
  }
  .game-title {
    font-family: 'Bungee', Impact, sans-serif; font-size: 4rem; color: #166534;
    text-shadow: 3px 3px 0 #4ade80, 6px 6px 0 rgba(0,0,0,0.1); margin-bottom: 4px;
  }
  .game-subtitle {
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif; font-size: 1.6rem;
    font-weight: 700; color: #15803d; margin-bottom: 4px;
  }
  .game-instructions {
    font-family: 'Fredoka', sans-serif; font-size: 0.85rem; color: #166534;
    opacity: 0.8; margin-bottom: 24px;
  }
  .game-btn {
    font-family: 'Bungee', Impact, sans-serif; font-size: 1.6rem; color: white;
    text-shadow: 1px 2px 0 rgba(0,0,0,0.2); border: 4px solid; border-radius: 16px;
    padding: 14px 44px; cursor: pointer; transition: transform 0.15s; outline: none;
  }
  .game-btn:hover { transform: scale(1.1); }
  .game-btn:active { transform: scale(0.95); }
  .btn-green {
    background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%); border-color: #15803d;
    box-shadow: 0 6px 0 #15803d, 0 8px 20px rgba(0,0,0,0.2);
  }
  .btn-purple {
    background: linear-gradient(180deg, #818cf8 0%, #6366f1 100%); border-color: #4338ca;
    box-shadow: 0 6px 0 #3730a3, 0 8px 20px rgba(0,0,0,0.3);
  }
  .gameover-title {
    font-family: 'Bungee', Impact, sans-serif; font-size: 4rem; color: #f87171;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3); margin-bottom: 12px;
  }
  .gameover-score {
    font-family: 'Bungee', Impact, sans-serif; font-size: 3.2rem; color: #fde047; margin-bottom: 4px;
  }
  .gameover-msg {
    font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #c7d2fe; margin-bottom: 28px;
  }
  .bottom-controls {
    font-family: 'Fredoka', sans-serif; color: rgba(22,101,52,0.5);
    margin-top: 28px; font-size: 0.85rem; display: flex; gap: 24px;
  }
  .alien-preview {
    margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(74,222,128,0.5));
  }
  .sun-glow {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(253,224,71,0.2) 0%, transparent 70%); pointer-events: none;
  }
  .gameover-glow {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(239,68,68,0.2) 0%, transparent 70%); pointer-events: none;
  }

  /* ===== MOBILE TOUCH CONTROLS ===== */
  #touch-controls {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 120px; z-index: 100; pointer-events: none;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .touch-area-left, .touch-area-right {
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; pointer-events: auto;
  }
  .touch-area-left { left: 16px; }
  .touch-area-right { right: 16px; }
  .touch-btn {
    width: 66px; height: 66px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: white;
    pointer-events: auto; touch-action: none;
  }
  .touch-btn.active {
    background: rgba(255,255,255,0.4); border-color: white;
  }
  .touch-btn-shoot {
    background: rgba(57,255,20,0.3); border-color: rgba(57,255,20,0.7);
    width: 70px; height: 70px;
  }
  .touch-btn-shoot.active { background: rgba(57,255,20,0.55); border-color: #39ff14; }
  .touch-btn-jump {
    background: rgba(250,204,21,0.3); border-color: rgba(250,204,21,0.7);
    width: 70px; height: 70px;
  }
  .touch-btn-jump.active { background: rgba(250,204,21,0.55); border-color: #facc15; }

  @media (max-width: 900px), (pointer: coarse) {
    .game-title { font-size: 2.4rem; }
    .game-subtitle { font-size: 1.1rem; }
    .gameover-title { font-size: 2.6rem; }
    .gameover-score { font-size: 2.4rem; }
    #score-display { font-size: 1.4rem; }
    .controls-hint { display: none; }
    .bottom-controls { display: none; }
    .game-instructions { font-size: 0.75rem; }
    #touch-controls { display: block; }
    #game-canvas { border-radius: 8px; border-width: 2px; }
  }
  @media (max-width: 500px) {
    .game-title { font-size: 1.8rem; }
    .game-subtitle { font-size: 0.9rem; }
    .gameover-title { font-size: 2rem; }
    .gameover-score { font-size: 2rem; }
    #score-display { font-size: 1.1rem; gap: 6px; }
    .game-btn { font-size: 1.2rem; padding: 10px 32px; }
  }
</style>
</head>
<body>
<div id="game-container" class="start-bg">
  <div id="start-screen" class="screen-overlay">
    <div class="sun-glow"></div>
    <svg class="alien-preview" width="120" height="120" viewBox="-60 -70 120 140" id="preview-svg"></svg>
    <div class="game-title">ALIEN PARK</div>
    <div class="game-subtitle">⭐ !ההרפתקה של דוידי ⭐</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
      <button class="game-btn btn-green" id="start-btn">▶ שחקן אחד</button>
      <button class="game-btn btn-purple" id="start2-btn">👫 שני שחקנים</button>
    </div>
    <div class="bottom-controls" style="flex-direction:column;align-items:center;gap:6px;color:#166534;font-weight:600">
      <span>🟢 שחקן 1: חצים ←→ ↑ · רווח לירייה</span>
      <span>🔵 שחקן 2: A D לתזוזה · W קפיצה · F לירייה</span>
    </div>
  </div>
  <div id="gameover-screen" class="screen-overlay" style="display:none">
    <div class="gameover-glow"></div>
    <div class="gameover-title" id="gameover-title">נגמרו החיים</div>
    <div class="gameover-score" id="final-score">0</div>
    <div id="lives-display" style="font-size:1.4rem; margin-bottom:6px; color:#fde68a; font-family:'Fredoka',sans-serif; font-weight:600;"></div>
    <div class="gameover-msg" id="gameover-msg">כמעט! בוא ננסה שוב 💪</div>
    <button class="game-btn btn-purple" id="retry-btn" style="display:none">▶ המשך</button>
    <button class="game-btn btn-green" id="restart-btn" style="display:none; margin-top:12px;">↺ שחק שוב</button>
  </div>
  <div id="playing-ui" style="display:none;">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="touch-controls" dir="ltr">
    <div class="touch-area-left">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-area-right">
      <button class="touch-btn touch-btn-shoot" id="btn-shoot">💥</button>
      <button class="touch-btn touch-btn-jump" id="btn-jump">⬆</button>
      <button class="touch-btn" id="btn-weapon" style="width:50px;height:50px;font-size:18px;background:rgba(139,92,246,0.35);border-color:rgba(139,92,246,0.7);position:absolute;bottom:80px;right:16px;">🔄</button>
    </div>
  </div>
</div>
<script>
(() => {
  let GW = 960; const GH = 540, GROUND_Y = 440;
  const GRAVITY = 0.55, JUMP_FORCE = -14, MOVE_SPEED = 5.5, LASER_SPEED = 12;
  const AIR_MOVE_SPEED = 6.5; // faster horizontal movement in air for arc jumps
  const EC = [
    { body: "#ef4444", dark: "#dc2626" },
    { body: "#a855f7", dark: "#9333ea" },
    { body: "#f97316", dark: "#ea580c" },
  ];
  const TREE_DEFS = [{o:100,v:0},{o:300,v:1},{o:550,v:0},{o:720,v:1}];
  const GRASS_O = [40,120,200,320,450,560,640,740];
  const FLOWER_D = [{o:80,c:"#f472b6"},{o:260,c:"#c084fc"},{o:480,c:"#fb923c"},{o:700,c:"#facc15"}];
  const HILL_D = [{o:150,rx:200,ry:60,a:0.5},{o:500,rx:250,ry:50,a:0.4},{o:750,rx:180,ry:55,a:0.45}];

  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = GW; canvas.height = GH;
  
  const finalScoreEl = document.getElementById("final-score");
  const startBtn = document.getElementById("start-btn");
  const retryBtn = document.getElementById("retry-btn");
  const restartBtn = document.getElementById("restart-btn");
  const gameoverTitle = document.getElementById("gameover-title");
  const livesDisplay = document.getElementById("lives-display");
  const gameoverMsg = document.getElementById("gameover-msg");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const playingUI = document.getElementById("playing-ui");
  const container = document.getElementById("game-container");
  const touchControls = document.getElementById("touch-controls");

  // Preview alien
  document.getElementById("preview-svg").innerHTML = `
    <ellipse cx="0" cy="0" rx="16" ry="20" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="0" cy="-26" rx="20" ry="18" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
    <line x1="-8" y1="-42" x2="-12" y2="-56" stroke="#22c55e" stroke-width="2"/>
    <circle cx="-12" cy="-58" r="4" fill="#facc15"/>
    <line x1="8" y1="-42" x2="12" y2="-56" stroke="#22c55e" stroke-width="2"/>
    <circle cx="12" cy="-58" r="4" fill="#facc15"/>
    <ellipse cx="-7" cy="-28" rx="8" ry="9" fill="white" stroke="#166534" stroke-width="1"/>
    <ellipse cx="7" cy="-28" rx="8" ry="9" fill="white" stroke="#166534" stroke-width="1"/>
    <circle cx="-5" cy="-27" r="4" fill="#1e1e1e"/>
    <circle cx="9" cy="-27" r="4" fill="#1e1e1e"/>
    <circle cx="-4" cy="-28" r="1.5" fill="white"/>
    <circle cx="10" cy="-28" r="1.5" fill="white"/>
    <path d="M -6,-18 Q 0,-12 6,-18" fill="none" stroke="#166534" stroke-width="1.5"/>
    <line x1="14" y1="-4" x2="24" y2="4" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="-14" y1="-4" x2="-22" y2="6" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="-6" y1="18" x2="-10" y2="34" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="10" y2="34" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-12" cy="36" rx="6" ry="3" fill="#f97316"/>
    <ellipse cx="12" cy="36" rx="6" ry="3" fill="#f97316"/>`;

  let state = "start";
  let player, lasers, enemies, coins, score, frame, spawnTimer, coinTimer, clouds, explosions, keys, cameraX;
  let platforms, platTimer, nextPlatX;
  let powerups, weaponLevel, weaponTimer;
  let buddyAliens, buddy, shieldTimer;
  let level, levelTransition, transitionFrame;
  let stars;
  let lives;
  let hitFlashTimer, invincibleTimer;
  let bossSpawnTimer, enemyProjectiles;
  let rocketPickups, hasRocket;
  let heartPickups, coinMultiplier, coinMultTimer, coinMultPickups;
  let shopOpen, shopItems;
  let currentWeapon, availableWeapons;
  let maxDistance, meteors, grenadePickups, hasGrenade;
  let icePickups, hasIce;
  let gamePaused;
  let twoPlayer = false, player2 = null, gameOverPending = false;
  let coinsCollected, nextCoinX, nextEnemyX;
  let victoryBonusLeft, victoryFrame, victoryCoinsFx, victoryNewRecord;
  // Level is reached by coins collected (never goes down when buying in the shop).
  // Coins only appear along the path ahead, so standing still doesn't earn them.
  const LEVEL_COINS = [0, 0, 100, 250, 450, 700]; // index = level number
  const FINAL_BOSS_COINS = 1000;
  const VICTORY_BONUS = 500;
  let highScore = 0;
  let finalBoss, finalBossActive, victoryScreen;
  const FINAL_BOSS_HP = 18;
  const FINAL_BOSS_DIST = 50000; // distance in level 5 to trigger boss
  try { highScore = parseInt(localStorage.getItem("alienParkHighScore")) || 0; } catch(e) {}
  const SHIELD_DURATION = 1800;
  // Distance-based level progression (not score)
  const LEVEL_DIST = [0, 5000, 12000, 22000, 35000]; // distances for levels 1→2→3→4→5
  const BOSS_HP = 5;
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  function initState() {
    player = { x: 200, y: GROUND_Y, vy: 0, right: true, ground: true, down: false, downTimer: 0 };
    player2 = twoPlayer ? { x: 130, y: GROUND_Y, vy: 0, right: true, ground: true, lives: 5, inv: 0, down: false, downTimer: 0 } : null;
    gameOverPending = false;
    lasers = []; enemies = []; coins = []; explosions = [];
    score = 0; frame = 0; spawnTimer = 0; coinTimer = 0; cameraX = 0;
    maxDistance = 0;
    coinsCollected = 0; nextCoinX = 450; nextEnemyX = 1100;
    victoryBonusLeft = 0; victoryFrame = 0; victoryCoinsFx = []; victoryNewRecord = false;
    meteors = [];
    grenadePickups = [];
    hasGrenade = false;
    icePickups = [];
    hasIce = false;
    gamePaused = false;
    finalBoss = null;
    finalBossActive = false;
    victoryScreen = false;
    lives = 5;
    hitFlashTimer = 0;
    invincibleTimer = 0;
    clouds = [{x:80,y:50,s:30,sp:0.2},{x:250,y:30,s:40,sp:0.15},{x:500,y:60,s:25,sp:0.25},{x:680,y:40,s:35,sp:0.18}];
    // Cloud platforms: solid clouds the player can stand on
    platforms = [];
    nextPlatX = 350;
    platTimer = 0;
    // Weapon powerups
    powerups = [];
    weaponLevel = 0; // 0 = normal laser, 1 = dual shot
    weaponTimer = 0;
    // Buddy alien (friendly blue alien)
    buddyAliens = []; // spawned pickups in the world
    buddy = null; // { x, y } — follows player once collected
    shieldTimer = 0; // frames remaining for shield
    // Level system
    level = 1;
    levelTransition = false;
    transitionFrame = 0;
    // Boss and rocket
    bossSpawnTimer = 0;
    enemyProjectiles = [];
    rocketPickups = [];
    hasRocket = false;
    heartPickups = [];
    coinMultiplier = 1;
    coinMultTimer = 0;
    coinMultPickups = [];
    shopOpen = false;
    shopItems = {
      tripleShot: { cost: 50, bought: false, label: "ירייה משולשת 🔥", desc: "3 לייזרים בבת אחת" },
      speedBoost: { cost: 30, bought: false, label: "מהירות ⚡", desc: "ריצה מהירה יותר" },
      superJump: { cost: 40, bought: false, label: "סופר קפיצה 🦘", desc: "קפיצה גבוהה יותר" },
      extraLife: { cost: 25, bought: false, label: "חיים נוספים ❤️", desc: "לב נוסף +1" },
    };
    // Weapon system — cycle between collected weapons
    currentWeapon = 0; // index into availableWeapons
    availableWeapons = ["laser"]; // starts with basic laser
    // Stars for moon level
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({ x: Math.random() * GW, y: Math.random() * (GROUND_Y - 20), s: 0.5 + Math.random() * 2, b: Math.random(), sp: 0.01 + Math.random() * 0.03 });
    }
    // Generate initial platforms ahead of player
    for (let i = 0; i < 6; i++) {
      spawnPlatform(nextPlatX);
      nextPlatX += level === 6 ? 460 + Math.random() * 220 : 180 + Math.random() * 160;
    }
    keys = {}; 
  }

  function spawnRingTower(wx) {
    // Floors going up — the low gravity on the ring lets Davidi reach them
    const tiers = [GROUND_Y - 80, GROUND_Y - 150, GROUND_Y - 220, GROUND_Y - 285];
    let t = Math.random() < 0.6 ? 0 : 1;
    const floors = 2 + Math.floor(Math.random() * 2.4); // 2-4 floors, mostly 2-3
    let x = wx;
    for (let k = 0; k < floors && t < tiers.length; k++, t++) {
      const py = tiers[t] - Math.random() * 10;
      const bar = t >= 2;
      const pw = bar ? 120 + Math.random() * 40 : 95 + Math.random() * 30;
      platforms.push({ x, y: py, w: pw, bar });
      if (t === 3) {
        coins.push({ x, y: py - 24, type: "gem", val: 5 });
        coins.push({ x: x - 34, y: py - 22, type: "silver", val: 3 });
        coins.push({ x: x + 34, y: py - 22, type: "silver", val: 3 });
      } else {
        coins.push({ x, y: py - 22, type: t === 2 ? "silver" : "gold", val: t === 2 ? 3 : 1 });
      }
      x += (Math.random() < 0.65 ? 1 : -1) * (75 + Math.random() * 45); // zig-zag staircase
    }
  }

  function spawnPlatform(wx) {
    if (level === 6) { spawnRingTower(wx); return; }
    const pw = 90 + Math.random() * 40; // width 90-130
    // Tiered heights: most platforms are low (easily reachable from ground),
    // some are medium (reachable from low platforms)
    const tier = Math.random();
    let py;
    if (tier < 0.55) {
      // Low tier — easy jump from ground (60-90px above ground)
      py = GROUND_Y - 60 - Math.random() * 30;
    } else if (tier < 0.85) {
      // Medium tier — reachable from low platforms (110-150px above ground)
      py = GROUND_Y - 110 - Math.random() * 40;
    } else {
      // High tier — needs a chain jump from medium (170-210px above ground)
      py = GROUND_Y - 170 - Math.random() * 40;
    }
    const plat = { x: wx, y: py, w: pw };
    platforms.push(plat);
    // Add a coin on top of each platform — higher platforms get better coins
    const r = Math.random();
    let ct = "gold", cv = 1;
    if (py < GROUND_Y - 150 && r < 0.5) { ct = "gem"; cv = 5; }
    else if (py < GROUND_Y - 100 && r < 0.4) { ct = "silver"; cv = 3; }
    coins.push({ x: wx, y: py - 22, type: ct, val: cv });
  }

  function spawnCoinGroup(wx) {
    const n = 3 + Math.floor(Math.random() * 3);
    const arc = Math.random() < 0.5; // arcs invite a jump
    for (let i = 0; i < n; i++) {
      const y = arc ? GROUND_Y - 30 - Math.sin((i / (n - 1)) * Math.PI) * 75 : GROUND_Y - 30;
      const r = Math.random();
      let t = "gold", v = 1;
      if (level >= 2 && r < 0.08) { t = "gem"; v = 5; }
      else if (level >= 2 && r < 0.22) { t = "silver"; v = 3; }
      coins.push({ x: wx + i * 34, y, type: t, val: v });
    }
  }

  function continueToRing() {
    victoryScreen = false;
    level = 6;
    levelTransition = true; transitionFrame = 0;
    enemies = []; enemyProjectiles = []; meteors = []; buddyAliens = [];
    platforms = platforms.filter(pl => pl.x < cameraX + GW * 0.6); nextPlatX = cameraX + GW * 0.75;
    invincibleTimer = 150;
    nextEnemyX = cameraX + GW + 400;
    // first ice beam shows up right away
    icePickups.push({ x: cameraX + GW * 0.7, y: GROUND_Y - 60 });
  }

  function fitCanvas() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    GW = Math.round(Math.min(1500, Math.max(720, GH * w / h)));
    canvas.width = GW; canvas.height = GH;
  }
  window.addEventListener("resize", fitCanvas);

  function showScreen(s) {
    state = s;
    startScreen.style.display = s === "start" ? "flex" : "none";
    gameoverScreen.style.display = s === "gameover" ? "flex" : "none";
    playingUI.style.display = s === "playing" ? "block" : "none";
    container.className = s === "start" ? "start-bg" : s === "gameover" ? "gameover-bg" : "sky-bg";
    touchControls.style.display = (isMobile && s === "playing") ? "block" : "none";
    if (s === "playing") fitCanvas();
    if (s === "gameover") {
      livesDisplay.textContent = (score > 0 && score >= highScore) ? "🏆 שיא חדש!" : "🏆 השיא שלך: " + highScore;
    }
  }

  function shootLaser(who) {
    const p = who || player;
    const dir = p.right ? 1 : -1;
    const ox = p.right ? 20 : -20;
    rebuildWeaponList();
    const wep = availableWeapons[currentWeapon];
    if (wep === "dual") {
      lasers.push({ x: p.x + ox, y: p.y - 28, dir, vy: -1.2, powered: true });
      lasers.push({ x: p.x + ox, y: p.y - 12, dir, vy: 1.2, powered: true });
    } else if (wep === "triple") {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: 0, powered: true });
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: -2.2, powered: true });
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: 2.2, powered: true });
    } else if (wep === "rocket") {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: 0, rocket: true });
    } else if (wep === "ice") {
      // Ice beam — passes through every enemy in its path
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: 0, ice: true, hits: [] });
    } else if (wep === "grenade") {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vx: 8 * dir, vy: -6, grenade: true, grav: 0.15 });
    } else {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir, vy: 0, powered: false });
    }
    if (buddy && p === player) {
      const box = p.right ? 15 : -15;
      lasers.push({ x: buddy.x + box, y: buddy.y - 15, dir, vy: 0, powered: false, buddy: true });
    }
  }

  // Drawing helpers
  function dC(x,y,r,f,a) { ctx.globalAlpha=a??1; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=f; ctx.fill(); ctx.globalAlpha=1; }

  function drawMoonSky() {

    const g = ctx.createLinearGradient(0,0,0,GH);

    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, 80, 60, 0, Math.PI*2); ctx.fill();

  function drawWeaponHotbar() {
    rebuildWeaponList();

    const allWeapons = ["laser", "dual", "triple", "rocket", "grenade", "ice"];

    const colors = { laser: "#22c55e", dual: "#7c3aed", triple: "#f97316", rocket: "#dc2626", grenade: "#166534", ice: "#0891b2" };

    for (let i = 0; i < allWeapons.length; i++) {
      const wx = startX + i * (slotW + gap);

      const selected = owned && availableWeapons[currentWeapon] === wkey;

      // Slot background
      if (selected) {
        ctx.fillStyle = colors[wkey]; ctx.globalAlpha = 0.7;
      } else if (owned) {

        ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2.5;
      } else {
        ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1;
      }
      ctx.beginPath(); ctx.roundRect(wx, sy, slotW, slotH, 8); ctx.stroke();

      // Number key
      ctx.fillStyle = selected ? "#fde047" : owned ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.3)";
      ctx.font = "bold 12px 'Bungee', Impact, sans-serif";
      ctx.textAlign = "left";

  // === SATURN'S RING (Level 6) ===
  // The ring is drawn as two non-concentric ellipses so it is wide near the
  // camera (under Davidi) and thin far away (behind the planet) — fake 3D.
  function ringGeom() {
    return { cx: GW * 0.5, cy: 252, rxi: GW * 0.56, ryi: 173, rxo: GW * 0.6, ryo: 269, d: 84 };
  }
  function ringEllipseAt(g, t) { // t: 0 = inner edge, 1 = outer edge
    return { cx: g.cx, cy: g.cy + g.d * t, rx: g.rxi + (g.rxo - g.rxi) * t, ry: g.ryi + (g.ryo - g.ryi) * t };
  }
  function ringPoint(g, t, a) {
    const e = ringEllipseAt(g, t);
    return [e.cx + e.rx * Math.cos(a), e.cy + e.ry * Math.sin(a)];
  }
  const RING_COLS = ["#f6e7c6", "#dcbd8e", "#efd8ae", "#c7a479", "#e9cf9f", "#b9996f", "#f2deb5", "#d2b083", "#e6c995", "#bf9f74"];
  function drawRingBands(g) {
    const n = RING_COLS.length;
    for (let k = 0; k < n; k++) {
      const e1 = ringEllipseAt(g, k / n), e2 = ringEllipseAt(g, (k + 1) / n);
      ctx.beginPath();
      ctx.ellipse(e2.cx, e2.cy, e2.rx, e2.ry, 0, 0, Math.PI * 2);
      ctx.moveTo(e1.cx + e1.rx, e1.cy);
      ctx.ellipse(e1.cx, e1.cy, e1.rx, e1.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = RING_COLS[k];
      ctx.fill("evenodd");
    }
  }
  function drawRingSky() {
    const g = ringGeom();
    const sky = ctx.createLinearGradient(0, 0, 0, GH);
    sky.addColorStop(0, "#070b1f"); sky.addColorStop(0.55, "#1b1748"); sky.addColorStop(1, "#33285e");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, GW, GH);
    stars.forEach(st => {
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(frame * st.sp + st.b * 10));
      dC(st.x * GW / 960, st.y * 0.75, st.s, "#ffffff", tw * 0.8);
    });
    // Whole ring first (its far half will stay behind the planet)
    drawRingBands(g);
    // far half is in shadow / farther away
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, GW, g.cy); ctx.clip();
    ctx.fillStyle = "rgba(20,14,50,0.35)"; ctx.fillRect(0, 0, GW, g.cy);
    ctx.restore();
    // Saturn
    const r = 132, px = g.cx, py = g.cy;
    const glow = ctx.createRadialGradient(px, py, r * 0.9, px, py, r * 1.5);
    glow.addColorStop(0, "rgba(253,230,170,0.25)"); glow.addColorStop(1, "rgba(253,230,170,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px, py, r * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.clip();
    const bands = ["#efcf98", "#d9a86c", "#f4dcae", "#c98f5a", "#e6be86", "#d4a373", "#f2d8a6", "#cf9b66"];
    const bh = 2 * r / bands.length;
    bands.forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.ellipse(px, py - r + i * bh + bh / 2, r * 1.2, bh * 0.62 + 2, Math.sin(frame * 0.003 + i) * 0.02, 0, Math.PI * 2);
      ctx.fill();
    });
    const shade = ctx.createRadialGradient(px - r * 0.45, py - r * 0.45, r * 0.15, px, py, r * 1.05);
    shade.addColorStop(0, "rgba(255,255,255,0.18)"); shade.addColorStop(1, "rgba(25,15,55,0.6)");
    ctx.fillStyle = shade; ctx.fillRect(px - r, py - r, 2 * r, 2 * r);
    ctx.restore();
  }
  function drawRingGround() {
    const g = ringGeom();
    // Near half of the ring passes in front of the planet
    ctx.save();
    ctx.beginPath(); ctx.rect(0, g.cy, GW, GH - g.cy); ctx.clip();
    drawRingBands(g);
    // light falls on the near part, far sides get darker
    const lit = ctx.createLinearGradient(0, g.cy, 0, GH);
    lit.addColorStop(0, "rgba(20,14,50,0.35)"); lit.addColorStop(0.55, "rgba(255,255,255,0)"); lit.addColorStop(1, "rgba(255,250,235,0.18)");
    ctx.fillStyle = lit; ctx.fillRect(0, g.cy, GW, GH - g.cy);
    // bright rim on the inner edge
    ctx.strokeStyle = "rgba(255,248,230,0.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rxi, g.ryi, 0, 0, Math.PI); ctx.stroke();
    // Ring surface moves under the runners: seams and ice chunks travel along the curve
    const tWalk = 0.3;
    const rWalk = g.rxi + (g.rxo - g.rxi) * tWalk;
    const off = cameraX / rWalk;
    const N = 56;
    for (let i = 0; i < N; i++) {
      let a = ((i / N) * Math.PI * 2 + off) % (Math.PI * 2);
      if (a < 0) a += Math.PI * 2;
      const sn = Math.sin(a);
      if (sn < 0.06) continue;
      // seam across the band
      const [x1, y1] = ringPoint(g, 0, a), [x2, y2] = ringPoint(g, 1, a);
      ctx.strokeStyle = `rgba(110,80,50,${0.07 * sn})`; ctx.lineWidth = 1 + sn;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      // ice chunk lying on the ring
      const t = 0.12 + ((i * 37) % 10) / 10 * 0.8;
      const [cx2, cy2] = ringPoint(g, t, a + 0.04);
      const sz = (2.5 + 9 * sn) * (0.7 + 0.5 * t);
      ctx.fillStyle = i % 3 ? "#e0f2fe" : "#a5d8f3";
      ctx.beginPath();
      ctx.moveTo(cx2 - sz, cy2); ctx.lineTo(cx2 - sz * 0.4, cy2 - sz * 0.9);
      ctx.lineTo(cx2 + sz * 0.6, cy2 - sz * 0.6); ctx.lineTo(cx2 + sz, cy2); ctx.closePath(); ctx.fill();
      if (i % 4 === 0) {
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.06 + i));
        dC(cx2 + sz * 0.2, cy2 - sz * 1.2, 1.2 + sn, "#ffffff", tw);
      }
    }
    ctx.restore();
  }

  function drawVictoryScreen() {
    victoryFrame++;
    const cx = GW / 2, cy = GH / 2;
    const scoreY = cy + 20;
    // Count the bonus up into the score, coins flying in
    if (victoryBonusLeft > 0 && victoryFrame > 50) {
      const step = Math.min(6, victoryBonusLeft);
      score += step; victoryBonusLeft -= step;
      if (victoryFrame % 3 === 0) victoryCoinsFx.push({ x: cx + (Math.random() - 0.5) * 220, y: cy - 30, t: 0 });
      if (victoryBonusLeft === 0 && score > highScore) {
        highScore = score; victoryNewRecord = true;
        try { localStorage.setItem("alienParkHighScore", highScore); } catch (e) {}
      }
    }
    // Background — solid each frame (no smearing)
    const g = ctx.createLinearGradient(0, 0, 0, GH);
    g.addColorStop(0, "#1e1b4b"); g.addColorStop(1, "#4c1d95");
    ctx.fillStyle = g; ctx.fillRect(0, 0, GW, GH);
    // Fireworks
    const colors = ["#ef4444","#fbbf24","#22c55e","#60a5fa","#c084fc","#f472b6"];
    for (let i = 0; i < 10; i++) {
      const fx = (GW / 10) * (i + 0.5);
      const fy = 60 + ((i * 53) % 140);
      const ft = (victoryFrame * 0.015 + i * 0.37) % 1;
      for (let j = 0; j < 8; j++) {
        const a = (j / 8) * Math.PI * 2;
        dC(fx + Math.cos(a) * ft * 55, fy + Math.sin(a) * ft * 55, 3.5 * (1 - ft), colors[(i + j) % 6], 0.9 * (1 - ft));
      }
    }
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    // Title
    ctx.fillStyle = "#fde047"; ctx.font = "700 54px 'Fredoka', sans-serif";
    ctx.fillText("🏆 ניצחון! 🏆", cx, cy - 130);
    ctx.fillStyle = "#e2e8f0"; ctx.font = "600 24px 'Fredoka', sans-serif";
    ctx.fillText("דוידי הביס את הרשע הגדול!", cx, cy - 90);
    // Bonus line — pulses while counting
    const pulse = victoryBonusLeft > 0 ? 1 + Math.sin(victoryFrame * 0.25) * 0.06 : 1;
    ctx.save(); ctx.translate(cx, cy - 38); ctx.scale(pulse, pulse);
    ctx.fillStyle = "#4ade80"; ctx.font = "700 30px 'Fredoka', sans-serif";
    ctx.fillText("+500 בונוס על הבוס!", 0, 0);
    ctx.restore();
    // Flying coins into the score
    victoryCoinsFx = victoryCoinsFx.filter(c => {
      c.t += 0.05;
      const x = c.x + (cx - c.x) * c.t, y = c.y + (scoreY - 12 - c.y) * c.t - Math.sin(c.t * Math.PI) * 40;
      drawCoin(x, y, "gold");
      return c.t < 1;
    });
    // Score
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.roundRect(cx - 130, scoreY - 40, 260, 58, 18); ctx.fill();
    ctx.save(); ctx.direction = "ltr";
    ctx.fillStyle = "#fde047"; ctx.font = "34px 'Bungee', Impact, sans-serif";
    ctx.fillText("🪙 " + score, cx, scoreY + 2);
    ctx.restore();
    if (victoryBonusLeft === 0 && victoryFrame > 50) {
      ctx.font = "700 20px 'Fredoka', sans-serif";
      if (victoryNewRecord) { ctx.fillStyle = "#4ade80"; ctx.fillText("🎉 שיא חדש!", cx, cy + 66); }
      else { ctx.fillStyle = "#cbd5e1"; ctx.fillText("🏆 השיא שלך: " + highScore, cx, cy + 66); }
      // Play again button
      ctx.fillStyle = "#22c55e";
      ctx.beginPath(); ctx.roundRect(cx - 120, cy + 85, 240, 50, 16); ctx.fill();
      ctx.fillStyle = "white"; ctx.font = "700 22px 'Fredoka', sans-serif";
      ctx.fillText("🚀 טסים לטבעת!", cx, cy + 118);
    }
  }

  // ===== Players (1 or 2) =====
  const P2_PAL = { body: "#60a5fa", dark: "#3b82f6", line: "#1e3a8a" };
  function activePlayers() {
    const a = [];
    if (!player.down) a.push(player);
    if (player2 && !player2.down) a.push(player2);
    return a;
  }
  function touchWho(x, y, dx, dy) {
    for (const pl of activePlayers()) if (Math.abs(pl.x - x) < dx && Math.abs(pl.y - y) < dy) return pl;
    return null;
  }
  function isInv(pl) { return shieldTimer > 0 || (pl === player ? invincibleTimer > 0 : pl.inv > 0); }
  function knockOut(pl) {
    if (!twoPlayer) { gameOverPending = true; return; }
    pl.down = true; pl.downTimer = 300; // 5 seconds in a bubble
    if (player.down && player2.down) gameOverPending = true;
  }
  function hurtPlayer(pl) {
    if (isInv(pl)) return false;
    explosions.push({ x: pl.x - cameraX, y: pl.y, sf: frame });
    hitFlashTimer = 60;
    if (pl === player) { lives--; invincibleTimer = 90; if (lives <= 0) knockOut(pl); }
    else { pl.lives--; pl.inv = 90; if (pl.lives <= 0) knockOut(pl); }
    return true;
  }
  function updateDownPlayers() {
    if (!player2) return;
    if (player2.inv > 0) player2.inv--;
    [player, player2].forEach(pl => {
      if (!pl.down) return;
      const other = pl === player ? player2 : player;
      pl.x += (other.x - 70 - pl.x) * 0.08;
      pl.y += (other.y - 90 - pl.y) * 0.08;
      pl.vy = 0;
      if (other.down) return;
      pl.downTimer--;
      if (pl.downTimer <= 0) {
        pl.down = false; pl.x = other.x - 40; pl.y = other.y; pl.vy = 0;
        if (pl === player) { lives = 3; invincibleTimer = 120; } else { pl.lives = 3; pl.inv = 120; }
      }
    });
  }
  function movePlayer(p, c) {
    const baseSpd = shopItems.speedBoost.bought ? MOVE_SPEED * 1.4 : MOVE_SPEED;
    const baseAir = shopItems.speedBoost.bought ? AIR_MOVE_SPEED * 1.3 : AIR_MOVE_SPEED;
    const spd = p.ground ? baseSpd : baseAir;
    if (c.left) { p.x -= spd; p.right = false; }
    if (c.right) { p.x += spd; p.right = true; }
    const baseJump = level === 6 ? -12 : JUMP_FORCE;
    const jf = shopItems.superJump.bought ? baseJump * 1.25 : baseJump;
    if (c.jump && p.ground) { p.vy = jf; p.ground = false; }
    p.vy += (level === 6 ? 0.36 : GRAVITY); p.y += p.vy;
    if (p.y >= GROUND_Y) { p.y = GROUND_Y; p.vy = 0; p.ground = true; }
    else if (p.vy > 0) p.ground = false;
    if (p.vy >= 0) {
      for (const pl of platforms) {
        const hw = pl.w / 2;
        const feetY = p.y + 36;
        const prevFeetY = feetY - p.vy;
        if (p.x > pl.x - hw - 10 && p.x < pl.x + hw + 10 && prevFeetY <= pl.y + 6 && feetY >= pl.y - 2) {
          p.y = pl.y - 36; p.vy = 0; p.ground = true;
        }
      }
    }
  }
  function drawPlayerSprite(pl, pal, inv) {
    const sx = pl.x - cameraX;
    if (pl.down) {
      ctx.save(); ctx.translate(sx, pl.y - 10); ctx.scale(0.7, 0.7);
      drawAlien(0, 10, true, true, pal);
      ctx.restore();
      ctx.save();
      const r = 44 + Math.sin(frame * 0.1) * 2;
      const g = ctx.createRadialGradient(sx - 12, pl.y - 26, 4, sx, pl.y - 10, r);
      g.addColorStop(0, "rgba(255,255,255,0.35)"); g.addColorStop(0.7, "rgba(186,230,253,0.12)"); g.addColorStop(1, "rgba(125,211,252,0.35)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, pl.y - 10, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "700 22px 'Fredoka', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 4;
      ctx.fillText(Math.ceil(pl.downTimer / 60), sx, pl.y - 66);
      ctx.restore();
      return;
    }
    drawAlien(sx, pl.y, pl.right, !pl.ground, pal);
    if (twoPlayer) {
      ctx.save();
      ctx.fillStyle = pal ? "#2563eb" : "#16a34a";
      ctx.beginPath(); ctx.arc(sx, pl.y - 76, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "700 14px 'Fredoka', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(pal ? "2" : "1", sx, pl.y - 75);
      ctx.restore();
    }
    if (pal && inv > 0 && Math.floor(frame / 4) % 2 === 0) { ctx.globalAlpha = 0.3; dC(sx, pl.y - 10, 30, "white"); ctx.globalAlpha = 1; }
  }

  function gameLoop() {
    if (state !== "playing") return;
    if (victoryScreen) {
      drawVictoryScreen();
      requestAnimationFrame(gameLoop);
      return;
    }
    if (gamePaused) {
      drawPauseOverlay();
      return;
    }
    if (shopOpen) {
      drawShopOverlay();
      return;
    }
    frame++;
    const p = player;

    // Movement for each player
    if (!player.down) movePlayer(player, { left: keys["ArrowLeft"], right: keys["ArrowRight"], jump: keys["ArrowUp"] });
    if (player2 && !player2.down) movePlayer(player2, { left: keys["KeyA"], right: keys["KeyD"], jump: keys["KeyW"] });
    updateDownPlayers();

    // Spawn new platforms ahead as player moves
    while (nextPlatX < cameraX + GW + 400) {
      spawnPlatform(nextPlatX);
      nextPlatX += level === 6 ? 460 + Math.random() * 220 : 180 + Math.random() * 160;
    }
    // Remove platforms far behind camera
    platforms = platforms.filter(pl => pl.x > cameraX - 300);

    // Camera smooth follow
    const leader = (player2 && !player2.down && (player.down || player2.x > player.x)) ? player2 : player;
    const targetCam = leader.x - GW * 0.35;
    cameraX += (targetCam - cameraX) * 0.1;
    if (player2) [player, player2].forEach(pl => {
      if (pl.down) return;
      if (pl.x < cameraX + 24) pl.x = cameraX + 24;
      if (pl.x > cameraX + GW - 24) pl.x = cameraX + GW - 24;
    });

    const psx = p.x - cameraX; // player screen x

    // Mobile auto-fire
    if (keys[" "] && state === "playing" && !player.down) {
      shootCooldown++;
      if (shootCooldown >= 14) { shootCooldown = 0; shootLaser(); }
    } else { shootCooldown = 0; }
    if (player2 && !player2.down && keys["KeyF"]) {
      shootCooldown2++;
      if (shootCooldown2 >= 14) { shootCooldown2 = 0; shootLaser(player2); }
    } else { shootCooldown2 = 0; }

    // Lasers
    lasers = lasers.filter(l => {
      if (l.grenade) {
        l.x += l.vx; l.vy += l.grav; l.y += l.vy;
        // Grenade explodes on ground — area damage
        if (l.y >= GROUND_Y - 5) {
          // Area explosion — kill all enemies within radius
          for (let i = enemies.length - 1; i >= 0; i--) {
            if (Math.abs(enemies[i].x - l.x) < 80 && Math.abs(enemies[i].y - l.y) < 60) {
              const pts = enemies[i].boss ? 10 : 5;
              score += pts;
              explosions.push({ x: enemies[i].x - cameraX, y: enemies[i].y, sf: frame, big: enemies[i].boss });
              enemies.splice(i, 1);
            }
          }
          explosions.push({ x: l.x - cameraX, y: l.y, sf: frame, big: true });
          return false;
        }
        const sx = l.x - cameraX; return sx > -40 && sx < GW + 40;
      }
      const spd = l.rocket ? 7 : LASER_SPEED;
      l.x += spd * l.dir; l.y += (l.vy || 0);
      const sx = l.x - cameraX; return sx > -40 && sx < GW + 40 && l.y > -20 && l.y < GH + 20;
    });

    // *** DIFFICULTY CURVE ***
    let spawnRate;
    if (level === 1) {
      spawnRate = Math.max(90, 150 - score * 0.5);
    } else if (level === 2) {
      spawnRate = Math.max(75, 110 - score * 0.1);
    } else if (level === 3) {
      spawnRate = 80;
    } else if (level === 4) {
      spawnRate = 75;
    } else if (level === 5) {
      spawnRate = 70; // Mars
    } else {
      spawnRate = 72; // level 6 — Saturn's ring
    }
    spawnTimer++;
    if (spawnTimer >= spawnRate * 1.4 && !finalBossActive) {
      spawnTimer = 0;
      const fromR = Math.random() > 0.5;
      const spX = fromR ? (cameraX + GW + 40) : (cameraX - 40);
      // Speed: capped more gently
      const spdCap = level >= 3 ? 1.5 : 2.0;
      const spd = (1.0 + Math.random() * 1.0 + Math.min(score * 0.008, spdCap)) * (fromR ? -1 : 1);
      enemies.push({ x: spX, y: GROUND_Y - 4, speed: spd, ci: Math.floor(Math.random()*3), v: Math.floor(Math.random()*2) });
    }

    // Coins — placed along the path ahead (runner style). Standing still = no new coins.
    while (nextCoinX < cameraX + GW + 200) {
      spawnCoinGroup(nextCoinX);
      nextCoinX += 380 + Math.random() * 220;
    }
    coins = coins.filter(c => c.x > cameraX - 400);

    // Enemies placed along the path ahead, so running never feels empty
    const enemyGap = [0, 720, 620, 580, 540, 480, 470][level] || 470;
    while (nextEnemyX < cameraX + GW + 60) {
      if (!finalBossActive && !levelTransition) {
        const ex = Math.max(nextEnemyX, cameraX + GW + 40);
        const espd = -(0.9 + Math.random() * 0.8 + Math.min(level * 0.15, 0.6));
        enemies.push({ x: ex, y: GROUND_Y - 4, speed: espd, ci: Math.floor(Math.random()*3), v: Math.floor(Math.random()*2) });
      }
      nextEnemyX += enemyGap + Math.random() * 260;
    }

    // Weapon powerup spawning — only if not yet collected
    if (weaponLevel === 0 && frame % 600 === 0 && Math.random() < 0.4 && powerups.length < 2) {
      powerups.push({
        x: cameraX + GW * 0.5 + Math.random() * GW * 0.4,
        y: GROUND_Y - 50 - Math.random() * 80,
        bobPhase: Math.random() * Math.PI * 2
      });
    }

    // Weapon is permanent once collected — no timer countdown

    // Player-powerup collision
    powerups = powerups.filter(pw => {
      if (touchWho(pw.x, pw.y, 30, 40)) {
        weaponLevel = 1;
        return false;
      }
      return pw.x > cameraX - 200;
    });

    // Buddy alien spawning — spawns every ~900 frames if no active buddy/shield
    if (shieldTimer <= 0 && !buddy && frame % 900 === 0 && Math.random() < 0.5 && buddyAliens.length < 1) {
      buddyAliens.push({
        x: cameraX + GW * 0.6 + Math.random() * GW * 0.3,
        y: GROUND_Y - 10
      });
    }

    // Shield timer countdown
    if (shieldTimer > 0) {
      shieldTimer--;
      if (shieldTimer <= 0) { buddy = null; }
    }

    // Player-buddy collision — pick up buddy
    buddyAliens = buddyAliens.filter(ba => {
      if (touchWho(ba.x, ba.y, 35, 40)) {
        buddy = { x: p.x - 30, y: p.y }; // start following
        shieldTimer = SHIELD_DURATION;
        return false;
      }
      return ba.x > cameraX - 200;
    });

    // Buddy follows player smoothly
    if (buddy) {
      const targetBX = p.x - (p.right ? 35 : -35);
      const targetBY = p.y;
      buddy.x += (targetBX - buddy.x) * 0.12;
      buddy.y += (targetBY - buddy.y) * 0.15;
    }

    // Move enemies
    enemies = enemies.filter(e => {
      // Boss behavior — stops to shoot
      if (e.boss) {
        e.shootTimer = (e.shootTimer || 0) + 1;
        if (e.shootTimer >= 90) { // shoot every 1.5 sec
          e.shootTimer = 0;
          // Fire projectile toward player
          const dx = p.x - e.x;
          const projDir = dx > 0 ? 1 : -1;
          enemyProjectiles.push({ x: e.x, y: e.y - 10, vx: projDir * 4, vy: -1.5 });
        }
        // Boss moves slower
        e.x += e.speed * 0.5;
      } else {
        e.x += e.speed;
      }
      const sx=e.x-cameraX; return sx>-120 && sx<GW+120;
    });

    // Boss spawning (level 3+) — first one appears quickly
    if (level >= 3 && !finalBossActive) {
      bossSpawnTimer++;
      const bossRate = bossSpawnTimer < 120 ? 120 : 350;
      if (bossSpawnTimer >= bossRate) {
        bossSpawnTimer = 0;
        const fromR = Math.random() > 0.5;
        const spX = fromR ? (cameraX + GW + 60) : (cameraX - 60);
        const spd = (0.8 + Math.random() * 0.6) * (fromR ? -1 : 1);
        enemies.push({ x: spX, y: GROUND_Y - 20, speed: spd, ci: 0, v: 0, boss: true, hp: BOSS_HP, shootTimer: 0 });
      }
    }

    // Final boss trigger — level 5 at distance threshold
    if (level === 5 && !finalBossActive && !victoryScreen && coinsCollected >= FINAL_BOSS_COINS) {
      finalBossActive = true;
      finalBoss = { x: cameraX + GW + 80, y: GROUND_Y - 30, hp: FINAL_BOSS_HP, shootTimer: 0, phase: 0 };
      enemies = []; // clear ALL enemies for clean boss arena
      meteors = [];
      enemyProjectiles = [];
    }

    // Final boss behavior
    if (finalBossActive && finalBoss) {
      // Move toward player — close enough to fight
      const targetX = (activePlayers()[0] || player).x + 180;
      const dx = targetX - finalBoss.x;
      finalBoss.x += dx * 0.03; // faster approach
      // Keep boss on screen
      if (finalBoss.x - cameraX > GW - 60) finalBoss.x = cameraX + GW - 60;
      if (finalBoss.x - cameraX < 60) finalBoss.x = cameraX + 60;
      // Shoot projectiles — faster in later phases
      finalBoss.shootTimer++;
      const shootRate = finalBoss.hp <= FINAL_BOSS_HP * 0.4 ? 40 : finalBoss.hp <= FINAL_BOSS_HP * 0.7 ? 60 : 80;
      if (finalBoss.shootTimer >= shootRate) {
        finalBoss.shootTimer = 0;
        const pdx = (activePlayers()[0] || player).x - finalBoss.x;
        const projDir = pdx > 0 ? 1 : -1;
        enemyProjectiles.push({ x: finalBoss.x, y: finalBoss.y - 20, vx: projDir * 5, vy: -2 });
        if (finalBoss.hp <= FINAL_BOSS_HP * 0.7) {
          enemyProjectiles.push({ x: finalBoss.x, y: finalBoss.y, vx: projDir * 4, vy: -3.5 });
        }
        if (finalBoss.hp <= FINAL_BOSS_HP * 0.4) {
          enemyProjectiles.push({ x: finalBoss.x, y: finalBoss.y + 10, vx: projDir * 3, vy: -1 });
        }
      }
      // Check laser hits on final boss
      lasers = lasers.filter(l => {
        if (!finalBoss) return true;
        if (Math.abs(l.x - finalBoss.x) < 45 && Math.abs(l.y - finalBoss.y) < 55) {
          const dmg = l.rocket ? 5 : l.grenade ? 3 : l.ice ? 2 : 1;
          finalBoss.hp -= dmg;
          explosions.push({ x: finalBoss.x - cameraX + (Math.random()-0.5)*30, y: finalBoss.y - 20 + (Math.random()-0.5)*30, sf: frame });
          if (finalBoss.hp <= 0) {
            explosions.push({ x: finalBoss.x - cameraX, y: finalBoss.y, sf: frame, big: true });
            explosions.push({ x: finalBoss.x - cameraX - 30, y: finalBoss.y - 30, sf: frame, big: true });
            explosions.push({ x: finalBoss.x - cameraX + 30, y: finalBoss.y - 20, sf: frame, big: true });
            victoryBonusLeft = VICTORY_BONUS; victoryFrame = 0; victoryCoinsFx = []; victoryNewRecord = false;
            finalBoss = null;
            finalBossActive = false;
            victoryScreen = true;
            if (score > highScore) {
              highScore = score;
              try { localStorage.setItem("alienParkHighScore", highScore); } catch(e) {}
            }
          }
          return false;
        }
        return true;
      });
      // Player collision with final boss
      if (finalBoss) { const who = touchWho(finalBoss.x, finalBoss.y, 35, 50); if (who) hurtPlayer(who); }
    }

    // Enemy projectiles movement
    enemyProjectiles = enemyProjectiles.filter(ep => {
      ep.x += ep.vx;
      ep.y += ep.vy;
      ep.vy += 0.06; // slight gravity arc
      const sx = ep.x - cameraX;
      return sx > -40 && sx < GW + 40 && ep.y < GH;
    });

    // Player hit by enemy projectile
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const ep = enemyProjectiles[i];
      const who = touchWho(ep.x, ep.y, 20, 30);
      if (who) { enemyProjectiles.splice(i, 1); hurtPlayer(who); }
    }

    // Rocket pickup spawning (level 3, if not collected) — appears quickly
    if (level >= 3 && !hasRocket) {
      if (rocketPickups.length < 1 && (frame % 400 === 0 || (frame > 10 && rocketPickups.length === 0 && !hasRocket && bossSpawnTimer < 150))) {
        rocketPickups.push({
          x: cameraX + GW * 0.4 + Math.random() * GW * 0.3,
          y: GROUND_Y - 40 - Math.random() * 60
        });
      }
    }

    // Player-rocket pickup
    rocketPickups = rocketPickups.filter(rp => {
      if (touchWho(rp.x, rp.y, 30, 40)) {
        hasRocket = true;
        return false;
      }
      return rp.x > cameraX - 200;
    });

    // Grenade pickup spawning (level 5+)
    let playerHit = false;
    if (level >= 5 && !hasGrenade && grenadePickups.length < 1 && frame % 300 === 0) {
      grenadePickups.push({
        x: cameraX + GW * 0.5 + Math.random() * GW * 0.3,
        y: GROUND_Y - 40 - Math.random() * 60
      });
    }
    // Ice beam pickup (level 6)
    if (level >= 6 && !hasIce && icePickups.length < 1 && frame % 300 === 0) {
      icePickups.push({ x: cameraX + GW * 0.5 + Math.random() * GW * 0.3, y: GROUND_Y - 40 - Math.random() * 60 });
    }
    icePickups = icePickups.filter(ip => {
      if (touchWho(ip.x, ip.y, 30, 40)) {
        hasIce = true; rebuildWeaponList(); currentWeapon = availableWeapons.indexOf("ice"); return false;
      }
      return ip.x > cameraX - 200;
    });
    grenadePickups = grenadePickups.filter(gp => {
      if (touchWho(gp.x, gp.y, 30, 40)) {
        hasGrenade = true; return false;
      }
      return gp.x > cameraX - 200;
    });

    // Meteors (level 5+) — fall from sky
    if (level === 5 && frame % 90 === 0 && !finalBossActive) {
      meteors.push({
        x: cameraX + 50 + Math.random() * (GW - 100),
        y: -30,
        vy: 2.5 + Math.random() * 2,
        vx: (Math.random() - 0.5) * 1.5,
        size: 12 + Math.random() * 10
      });
    }
    meteors = meteors.filter(m => {
      m.x += m.vx; m.y += m.vy;
      if (m.y > GH + 30) return false;
      // Hit ground — explode
      if (m.y >= GROUND_Y - 5) {
        explosions.push({ x: m.x - cameraX, y: GROUND_Y, sf: frame });
        return false;
      }
      // Hit player
      { const who = touchWho(m.x, m.y, m.size + 10, m.size + 15); if (who && hurtPlayer(who)) return false; }
      return true;
    });

    // Heart pickup spawning — every ~1000 frames, if lives < 5
    if ((lives < 5 || (player2 && player2.lives < 5)) && frame % 1000 === 0 && Math.random() < 0.5 && heartPickups.length < 1) {
      heartPickups.push({
        x: cameraX + GW * 0.3 + Math.random() * GW * 0.4,
        y: GROUND_Y - 40 - Math.random() * 80
      });
    }

    // Player-heart pickup
    heartPickups = heartPickups.filter(hp => {
      const who = touchWho(hp.x, hp.y, 28, 38);
      if (who) {
        if (who === player) lives = Math.min(lives + 1, 5); else who.lives = Math.min(who.lives + 1, 5);
        return false;
      }
      return hp.x > cameraX - 200;
    });

    // x2 coin multiplier spawning — every ~800 frames
    if (coinMultiplier <= 1 && frame % 800 === 0 && Math.random() < 0.4 && coinMultPickups.length < 1) {
      coinMultPickups.push({
        x: cameraX + GW * 0.4 + Math.random() * GW * 0.3,
        y: GROUND_Y - 30 - Math.random() * 70
      });
    }

    // Player-coinMult pickup
    coinMultPickups = coinMultPickups.filter(cm => {
      if (touchWho(cm.x, cm.y, 28, 38)) {
        coinMultiplier = 2;
        coinMultTimer = 900; // 15 seconds
        return false;
      }
      return cm.x > cameraX - 200;
    });

    // Coin multiplier timer
    if (coinMultTimer > 0) {
      coinMultTimer--;
      if (coinMultTimer <= 0) coinMultiplier = 1;
    }

    // Laser-enemy collisions
    lasers = lasers.filter(l => {
      let hit = false;
      enemies = enemies.filter(e => {
        const hitDist = e.boss ? 30 : 24;
        const hitDistY = e.boss ? 50 : 30;
        if (l.ice && l.hits.includes(e)) return true;
        if (Math.abs(l.x - e.x) < hitDist && Math.abs(l.y - e.y) < hitDistY) {
          hit = true;
          if (l.ice) l.hits.push(e);
          if (e.boss) {
            // Rocket kills boss instantly
            if (l.rocket) {
              score += 10; 
              explosions.push({ x: e.x - cameraX, y: e.y, sf: frame, big: true });
              return false; // boss dead
            }
            // Normal/powered laser: reduce HP (ice hits harder)
            e.hp -= l.ice ? 2 : 1;
            if (e.hp <= 0) {
              score += 10; 
              explosions.push({ x: e.x - cameraX, y: e.y, sf: frame, big: true });
              return false;
            }
            // Boss survives — laser consumed but boss stays
            return true;
          } else {
            // Normal enemy
            score += 5; 
            explosions.push({ x: e.x - cameraX, y: e.y, sf: frame });
            return false;
          }
        }
        return true;
      });
      return l.ice ? true : !hit;
    });

    // Player-coin — check against player center body
    coins = coins.filter(c => {
      if (touchWho(c.x, c.y, 30, 45)) {
        const gain = (c.val || 1) * coinMultiplier; score += gain; coinsCollected += gain; return false;
      }
      return true;
    });

    // Track max distance (only counts forward movement)
    if (leader.x > maxDistance) maxDistance = leader.x;

    // Distance-based level transition
    const nextLevel = level < 5 ? level + 1 : 0;
    if (nextLevel > 0 && coinsCollected >= LEVEL_COINS[nextLevel] && !levelTransition) {
      levelTransition = true;
      transitionFrame = 0;
    }
    if (levelTransition) {
      transitionFrame++;
      if (transitionFrame >= 120) {
        if (level < 5) level++;
        levelTransition = false;
        enemies = [];
        buddyAliens = [];
        enemyProjectiles = [];
        meteors = [];
      }
    }

    // Player-enemy
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const who = touchWho(e.x, e.y, 28, 36);
      if (!who) continue;
      if (shieldTimer > 0) {
        score += 3;
        explosions.push({ x: e.x - cameraX, y: e.y, sf: frame });
        enemies.splice(i, 1);
      } else if (hurtPlayer(who)) {
        enemies.splice(i, 1);
      }
    }

    // Invincible timer countdown
    if (invincibleTimer > 0) invincibleTimer--;
    if (hitFlashTimer > 0) hitFlashTimer--;

    // Clouds (only level 1)
    if (level === 1) clouds.forEach(c => { c.x += c.sp; if (c.x > GW + 60) c.x = -60; });
    // Explosions cleanup
    explosions = explosions.filter(e => (frame - e.sf) < (e.big ? 35 : 20));

    // === RENDER ===
    if (level === 1) {
      drawSky(); drawSun();
      clouds.forEach(c => drawCloud(c.x, c.y, c.s));
      drawHills();
      TREE_DEFS.forEach(t => drawTree(wrapX(t.o, 0.7), t.v));
      drawGround();
    } else if (level === 6) {
      drawRingSky(); drawRingGround();
    } else if (level === 5) {
      drawMarsSky(); drawMarsHills(); drawMarsGround();
    } else if (level === 4) {
      drawDeepSpaceSky(); drawSpaceGround();
    } else {
      drawMoonSky(); drawEarth(); drawMoonHills(); drawGround();
    }
    // Platforms by level
    platforms.forEach(pl => {
      const sx = pl.x - cameraX;
      if (sx > -100 && sx < GW + 100) {
        if (level === 6) { if (pl.bar) drawCrystalBar(sx, pl.y, pl.w); else drawIcePlatform(sx, pl.y, pl.w); }
        else if (level === 5) drawMarsPlatform(sx, pl.y, pl.w);
        else if (level === 4) drawSpacePlatform(sx, pl.y, pl.w);
        else if (level >= 2) drawMoonPlatform(sx, pl.y, pl.w);
        else drawPlatformCloud(sx, pl.y, pl.w);
      }
    });
    coins.forEach(c => drawCoin(c.x - cameraX, c.y, c.type));
    powerups.forEach(pw => { const sx=pw.x-cameraX; if(sx>-40&&sx<GW+40) drawPowerup(sx, pw.y, pw.bobPhase); });
    buddyAliens.forEach(ba => { const sx=ba.x-cameraX; if(sx>-40&&sx<GW+40) drawBuddyPickup(sx, ba.y); });
    rocketPickups.forEach(rp => { const sx=rp.x-cameraX; if(sx>-40&&sx<GW+40) drawRocketPickup(sx, rp.y); });
    heartPickups.forEach(hp => { const sx=hp.x-cameraX; if(sx>-40&&sx<GW+40) drawHeartPickup(sx, hp.y); });
    coinMultPickups.forEach(cm => { const sx=cm.x-cameraX; if(sx>-40&&sx<GW+40) drawCoinMultPickup(sx, cm.y); });
    // Grenade pickups
    icePickups.forEach(ip => { const sx=ip.x-cameraX; if(sx>-40&&sx<GW+40) drawIcePickup(sx, ip.y); });
    grenadePickups.forEach(gp => { const sx=gp.x-cameraX; if(sx>-40&&sx<GW+40) drawGrenadePickup(sx, gp.y); });
    // Meteors
    meteors.forEach(m => { drawMeteor(m.x - cameraX, m.y, m.size); });
    // Enemies — mars, boss, space, or regular
    enemies.forEach(e => {
      const sx = e.x - cameraX;
      if (e.boss) drawBossAlien(sx, e.y, e.hp);
      else if (level === 6) drawIceEnemy(sx, e.y, e.v);
      else if (level === 5) drawMarsEnemy(sx, e.y, e.v);
      else if (level === 4) drawSpaceEnemy(sx, e.y, e.v);
      else drawEnemy(sx, e.y, e.ci, e.v);
    });
    enemyProjectiles.forEach(ep => { const sx=ep.x-cameraX; drawEnemyProjectile(sx, ep.y); });
    lasers.forEach(l => {
      const sx = l.x - cameraX;
      if (l.rocket) drawRocket(sx, l.y, l.dir);
      else if (l.grenade) drawGrenadeProjectile(sx, l.y, l.dir);
      else if (l.ice) drawIceBeam(sx, l.y, l.dir);
      else drawLaser(sx, l.y, l.powered, l.buddy);
    });
    explosions.forEach(e => {
      if (e.big) drawBigExplosion(e);
      else drawExplosion(e);
    });
    if (player2) {
      if (shieldTimer > 0 && !player2.down) drawShieldBubble(player2.x - cameraX, player2.y);
      drawPlayerSprite(player2, Object.assign({ moving: keys["KeyA"] || keys["KeyD"] }, P2_PAL), player2.inv);
    }
    if (shieldTimer > 0 && !player.down) drawShieldBubble(psx, p.y);
    drawPlayerSprite(player, null, invincibleTimer);
    if (buddy) drawBuddyAlien(buddy.x - cameraX, buddy.y, p.right);
    // Final boss
    if (finalBossActive && finalBoss) drawFinalBoss(finalBoss);
    drawWeaponHotbar();
    drawScoreHUD();
    drawShieldIndicator();
    drawCoinMultIndicator();
    drawLevelIndicator();
    drawShopButton();
    drawPauseButton();
    drawHeartsHUD();
    drawProgressBar();
    // Level transition overlay
    if (levelTransition) drawLevelTransition();

    // Hit flash text "!אאוץ׳"
    if (hitFlashTimer > 0) {
      const alpha = Math.min(hitFlashTimer / 30, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 38px 'Bungee', Impact, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("!אאוץ׳", GW / 2, GH / 2 - 30);
      ctx.globalAlpha = 1;
    }

    // Player blinks when invincible (already drawn above, re-draw with blink)
    if (invincibleTimer > 0 && !player.down && Math.floor(frame / 4) % 2 === 0) {
      // Draw white flash over player position
      ctx.globalAlpha = 0.3;
      dC(psx, p.y - 10, 30, "white");
      ctx.globalAlpha = 1;
    }

    // All lives gone — game over
    if (playerHit || gameOverPending) {
      finalScoreEl.textContent = score;
      gameoverTitle.textContent = "נגמרו החיים";
      livesDisplay.textContent = "🖤🖤🖤🖤🖤";
      gameoverMsg.textContent = twoPlayer ? "כמעט! בואו ננסה שוב 💪" : "כמעט! בוא ננסה שוב 💪";
      retryBtn.style.display = "none";
      restartBtn.style.display = "inline-block";
      if(score>highScore){highScore=score;try{localStorage.setItem("alienParkHighScore",highScore)}catch(e){}} showScreen("gameover");
      return;
    }

    requestAnimationFrame(gameLoop);
  }

  showScreen("start");
})();
</script>
</body>
</html>
