<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alien Park - דוידי 🛸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    position: fixed;
    width: 100%;
    height: 100%;
  }
  #game-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sky-bg { background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 40%, #7dd3fc 100%); }
  .start-bg { background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 50%, #bae6fd 100%); }
  .gameover-bg { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); }
  #score-display {
    font-family: 'Bungee', Impact, sans-serif;
    font-size: 2.2rem;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .star-icon { color: #fde047; font-size: 1.6rem; }
  #game-canvas {
    border: 4px solid #166534;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    display: block;
    max-width: 100vw;
  }
  .controls-hint {
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
    color: white; opacity: 0.7; margin-top: 10px; font-size: 0.9rem;
    display: flex; gap: 24px;
  }
  .screen-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
  }
  .game-title {
    font-family: 'Bungee', Impact, sans-serif; font-size: 4rem; color: #166534;
    text-shadow: 3px 3px 0 #4ade80, 6px 6px 0 rgba(0,0,0,0.1); margin-bottom: 4px;
  }
  .game-subtitle {
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif; font-size: 1.6rem;
    font-weight: 700; color: #15803d; margin-bottom: 4px;
  }
  .game-instructions {
    font-family: 'Fredoka', sans-serif; font-size: 0.85rem; color: #166534;
    opacity: 0.8; margin-bottom: 24px;
  }
  .game-btn {
    font-family: 'Bungee', Impact, sans-serif; font-size: 1.6rem; color: white;
    text-shadow: 1px 2px 0 rgba(0,0,0,0.2); border: 4px solid; border-radius: 16px;
    padding: 14px 44px; cursor: pointer; transition: transform 0.15s; outline: none;
  }
  .game-btn:hover { transform: scale(1.1); }
  .game-btn:active { transform: scale(0.95); }
  .btn-green {
    background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%); border-color: #15803d;
    box-shadow: 0 6px 0 #15803d, 0 8px 20px rgba(0,0,0,0.2);
  }
  .btn-purple {
    background: linear-gradient(180deg, #818cf8 0%, #6366f1 100%); border-color: #4338ca;
    box-shadow: 0 6px 0 #3730a3, 0 8px 20px rgba(0,0,0,0.3);
  }
  .gameover-title {
    font-family: 'Bungee', Impact, sans-serif; font-size: 4rem; color: #f87171;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3); margin-bottom: 12px;
  }
  .gameover-score {
    font-family: 'Bungee', Impact, sans-serif; font-size: 3.2rem; color: #fde047; margin-bottom: 4px;
  }
  .gameover-msg {
    font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #c7d2fe; margin-bottom: 28px;
  }
  .bottom-controls {
    font-family: 'Fredoka', sans-serif; color: rgba(22,101,52,0.5);
    margin-top: 28px; font-size: 0.85rem; display: flex; gap: 24px;
  }
  .alien-preview {
    margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(74,222,128,0.5));
  }
  .sun-glow {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(253,224,71,0.2) 0%, transparent 70%); pointer-events: none;
  }
  .gameover-glow {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(239,68,68,0.2) 0%, transparent 70%); pointer-events: none;
  }

  /* ===== MOBILE TOUCH CONTROLS ===== */
  #touch-controls {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 120px; z-index: 100; pointer-events: none;
    padding: 10px 16px 16px;
  }
  .touch-area-left, .touch-area-right {
    position: absolute; bottom: 16px; display: flex; gap: 10px; pointer-events: auto;
  }
  .touch-area-left { left: 16px; }
  .touch-area-right { right: 16px; }
  .touch-btn {
    width: 66px; height: 66px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: white;
    pointer-events: auto; touch-action: none;
  }
  .touch-btn.active {
    background: rgba(255,255,255,0.4); border-color: white;
  }
  .touch-btn-shoot {
    background: rgba(57,255,20,0.3); border-color: rgba(57,255,20,0.7);
    width: 70px; height: 70px;
  }
  .touch-btn-shoot.active { background: rgba(57,255,20,0.55); border-color: #39ff14; }
  .touch-btn-jump {
    background: rgba(250,204,21,0.3); border-color: rgba(250,204,21,0.7);
    width: 70px; height: 70px;
  }
  .touch-btn-jump.active { background: rgba(250,204,21,0.55); border-color: #facc15; }

  /* ===== DIRECT TOUCH HINT ===== */
  #touch-hint {
    display: none;
    position: fixed; bottom: 26px; left: 0; right: 0;
    text-align: center; z-index: 120; pointer-events: none;
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif; font-weight: 600;
    font-size: 0.95rem; color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
    transition: opacity 0.8s ease;
  }
  #touch-hint.show { display: block; opacity: 1; }
  #touch-hint.fade { opacity: 0; }

  @media (max-width: 900px), (pointer: coarse) {
    .game-title { font-size: 2.4rem; }
    .game-subtitle { font-size: 1.1rem; }
    .gameover-title { font-size: 2.6rem; }
    .gameover-score { font-size: 2.4rem; }
    .controls-hint { display: none; }
    .bottom-controls { display: none; }
    .game-instructions { font-size: 0.75rem; }
    #touch-controls { display: none; }
    #game-canvas { border: none; border-radius: 0; box-shadow: none; }
    /* full-bleed playfield with the HUD floating on top of it */
    #playing-ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; justify-content: center; }
    #score-display {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 60; margin: 0; font-size: 1.05rem; gap: 8px;
      background: rgba(0,0,0,0.3); padding: 5px 18px; border-radius: 999px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #score-display .star-icon { font-size: 1rem; }
  }

  /* ===== ROTATE YOUR DEVICE ===== */
  #rotate-screen {
    display: none;
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 45%, #7dd3fc 100%);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif; color: white;
  }
  #rotate-screen.show { display: flex; }
  .rotate-icon {
    font-size: 4.5rem; margin-bottom: 18px;
    animation: rotate-tilt 2s ease-in-out infinite;
  }
  @keyframes rotate-tilt {
    0%, 25% { transform: rotate(0deg); }
    55%, 85% { transform: rotate(-90deg); }
    100% { transform: rotate(0deg); }
  }
  .rotate-title {
    font-family: 'Bungee', Impact, sans-serif; font-size: 1.5rem;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2); margin-bottom: 8px;
  }
  .rotate-sub { font-size: 1rem; opacity: 0.9; margin-bottom: 26px; }
  .rotate-anyway {
    background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.6);
    color: white; font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 0.95rem; padding: 10px 26px; border-radius: 999px; cursor: pointer;
  }
  @media (max-width: 500px) {
    .game-title { font-size: 1.8rem; }
    .game-subtitle { font-size: 0.9rem; }
    .gameover-title { font-size: 2rem; }
    .gameover-score { font-size: 2rem; }
    #score-display { font-size: 1.1rem; gap: 6px; }
    .game-btn { font-size: 1.2rem; padding: 10px 32px; }
  }
</style>
</head>
<body>
<div id="game-container" class="start-bg">
  <div id="start-screen" class="screen-overlay">
    <div class="sun-glow"></div>
    <svg class="alien-preview" width="120" height="120" viewBox="-60 -70 120 140" id="preview-svg"></svg>
    <div class="game-title">ALIEN PARK</div>
    <div class="game-subtitle">⭐ !ההרפתקה של דוידי ⭐</div>
    <div class="game-instructions" id="game-instructions">חצים לזוז ולקפוץ • רווח לירות</div>
    <button class="game-btn btn-green" id="start-btn">▶ START GAME</button>
    <div class="bottom-controls">
      <span>←→ תזוזה</span><span>↑ קפיצה</span><span>רווח ירייה</span>
    </div>
  </div>
  <div id="gameover-screen" class="screen-overlay" style="display:none">
    <div class="gameover-glow"></div>
    <div class="gameover-title" id="gameover-title">GAME OVER</div>
    <div class="gameover-score" id="final-score">0</div>
    <div id="lives-display" style="font-size:1.6rem; margin-bottom:4px;"></div>
    <div class="gameover-msg" id="gameover-msg">!כל הכבוד דוידי 🛸</div>
    <button class="game-btn btn-purple" id="retry-btn" style="display:none">▶ CONTINUE</button>
    <button class="game-btn btn-green" id="restart-btn" style="display:none; margin-top:12px;">↺ START OVER</button>
  </div>
  <div id="playing-ui" style="display:none; flex-direction:column; align-items:center; position:relative;">
    <div id="score-display">
      <span class="star-icon">⭐</span>
      <span>SCORE: <span id="score-value">0</span></span>
      <span class="star-icon">⭐</span>
    </div>
    <div style="position:relative;">
      <canvas id="game-canvas"></canvas>
      <div id="hit-overlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20; pointer-events:none;">
        <div id="hit-hearts" style="font-size:2rem; margin-bottom:6px;"></div>
        <div id="hit-msg" style="font-family:'Bungee',Impact,sans-serif; font-size:2.2rem; color:#ef4444; text-shadow:2px 2px 0 rgba(0,0,0,0.4); margin-bottom:10px;">!אאוץ׳</div>
        <button id="hit-continue-btn" class="game-btn btn-purple" style="pointer-events:auto; font-size:1.2rem; padding:10px 32px;">▶ CONTINUE</button>
      </div>
    </div>
    <div class="controls-hint">
      <span>←→ תזוזה</span><span>↑ קפיצה</span><span>רווח ירייה</span>
    </div>
  </div>
  <div id="touch-controls" dir="ltr" style="display:none">
    <div class="touch-area-left">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-area-right">
      <button class="touch-btn touch-btn-shoot" id="btn-shoot">💥</button>
      <button class="touch-btn touch-btn-jump" id="btn-jump">⬆</button>
    </div>
  </div>
  <div id="touch-hint">גררו לזוז · הקישו לירות · החליקו למעלה לקפוץ</div>
  <div id="rotate-screen">
    <div class="rotate-icon">📱</div>
    <div class="rotate-title">סובבו את המכשיר</div>
    <div class="rotate-sub">המשחק בנוי למסך רחב 🛸</div>
    <button class="rotate-anyway" id="rotate-anyway">בכל זאת לשחק ככה</button>
  </div>
</div>
<script>
(() => {
  let GW = 800;
  const GH = 500, GROUND_Y = 400;
  const GRAVITY = 0.55, JUMP_FORCE = -14, MOVE_SPEED = 5.5, LASER_SPEED = 12;
  const AIR_MOVE_SPEED = 6.5; // faster horizontal movement in air for arc jumps
  const EC = [
    { body: "#ef4444", dark: "#dc2626" },
    { body: "#a855f7", dark: "#9333ea" },
    { body: "#f97316", dark: "#ea580c" },
  ];
  const TREE_DEFS = [{o:100,v:0},{o:300,v:1},{o:550,v:0},{o:720,v:1}];
  const GRASS_O = [40,120,200,320,450,560,640,740];
  const FLOWER_D = [{o:80,c:"#f472b6"},{o:260,c:"#c084fc"},{o:480,c:"#fb923c"},{o:700,c:"#facc15"}];
  const HILL_D = [{o:150,rx:200,ry:60,a:0.5},{o:500,rx:250,ry:50,a:0.4},{o:750,rx:180,ry:55,a:0.45}];

  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = GW; canvas.height = GH;
  const scoreEl = document.getElementById("score-value");
  const finalScoreEl = document.getElementById("final-score");
  const startBtn = document.getElementById("start-btn");
  const retryBtn = document.getElementById("retry-btn");
  const restartBtn = document.getElementById("restart-btn");
  const gameoverTitle = document.getElementById("gameover-title");
  const livesDisplay = document.getElementById("lives-display");
  const gameoverMsg = document.getElementById("gameover-msg");
  const hitOverlay = document.getElementById("hit-overlay");
  const hitHearts = document.getElementById("hit-hearts");
  const hitContinueBtn = document.getElementById("hit-continue-btn");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const playingUI = document.getElementById("playing-ui");
  const container = document.getElementById("game-container");
  const touchControls = document.getElementById("touch-controls");
  const touchHint = document.getElementById("touch-hint");
  let hintTimer = null;
  function showTouchHint() {
    clearTimeout(hintTimer);
    touchHint.className = "show";
    hintTimer = setTimeout(() => {
      touchHint.className = "show fade";
      hintTimer = setTimeout(() => { touchHint.className = ""; }, 900);
    }, 3500);
  }

  // Preview alien
  document.getElementById("preview-svg").innerHTML = `
    <ellipse cx="0" cy="0" rx="16" ry="20" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="0" cy="-26" rx="20" ry="18" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
    <line x1="-8" y1="-42" x2="-12" y2="-56" stroke="#22c55e" stroke-width="2"/>
    <circle cx="-12" cy="-58" r="4" fill="#facc15"/>
    <line x1="8" y1="-42" x2="12" y2="-56" stroke="#22c55e" stroke-width="2"/>
    <circle cx="12" cy="-58" r="4" fill="#facc15"/>
    <ellipse cx="-7" cy="-28" rx="8" ry="9" fill="white" stroke="#166534" stroke-width="1"/>
    <ellipse cx="7" cy="-28" rx="8" ry="9" fill="white" stroke="#166534" stroke-width="1"/>
    <circle cx="-5" cy="-27" r="4" fill="#1e1e1e"/>
    <circle cx="9" cy="-27" r="4" fill="#1e1e1e"/>
    <circle cx="-4" cy="-28" r="1.5" fill="white"/>
    <circle cx="10" cy="-28" r="1.5" fill="white"/>
    <path d="M -6,-18 Q 0,-12 6,-18" fill="none" stroke="#166534" stroke-width="1.5"/>
    <line x1="14" y1="-4" x2="24" y2="4" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="-14" y1="-4" x2="-22" y2="6" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="-6" y1="18" x2="-10" y2="34" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="10" y2="34" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-12" cy="36" rx="6" ry="3" fill="#f97316"/>
    <ellipse cx="12" cy="36" rx="6" ry="3" fill="#f97316"/>`;

  let state = "start";
  let player, lasers, enemies, coins, score, frame, spawnTimer, coinTimer, clouds, explosions, keys, cameraX;
  let platforms, platTimer, nextPlatX;
  let powerups, weaponLevel, weaponTimer;
  let buddyAliens, buddy, shieldTimer;
  let level, levelTransition, transitionFrame;
  let stars;
  let lives;
  let hitPause, hitPauseFrame;
  let bossSpawnTimer, enemyProjectiles;
  let rocketPickups, hasRocket;
  let heartPickups, coinMultiplier, coinMultTimer, coinMultPickups;
  let shopOpen, shopItems;
  const SHIELD_DURATION = 1800;
  const LEVEL2_SCORE = 100;
  const LEVEL3_SCORE = 250;
  const LEVEL4_SCORE = 450;
  const BOSS_HP = 5;
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isMobile) {
    const gi = document.getElementById("game-instructions");
    if (gi) gi.textContent = "גררו לזוז • הקישו לירות • החליקו למעלה לקפוץ";
  }

  function initState() {
    player = { x: 200, y: GROUND_Y, vy: 0, right: true, ground: true };
    lasers = []; enemies = []; coins = []; explosions = [];
    score = 0; frame = 0; spawnTimer = 0; coinTimer = 0; cameraX = 0;
    lives = 5;
    hitPause = false;
    hitPauseFrame = 0;
    clouds = [{x:80,y:50,s:30,sp:0.2},{x:250,y:30,s:40,sp:0.15},{x:500,y:60,s:25,sp:0.25},{x:680,y:40,s:35,sp:0.18}];
    // Cloud platforms: solid clouds the player can stand on
    platforms = [];
    nextPlatX = 350;
    platTimer = 0;
    // Weapon powerups
    powerups = [];
    weaponLevel = 0; // 0 = normal laser, 1 = dual shot
    weaponTimer = 0;
    // Buddy alien (friendly blue alien)
    buddyAliens = []; // spawned pickups in the world
    buddy = null; // { x, y } — follows player once collected
    shieldTimer = 0; // frames remaining for shield
    // Level system
    level = 1;
    levelTransition = false;
    transitionFrame = 0;
    // Boss and rocket
    bossSpawnTimer = 0;
    enemyProjectiles = [];
    rocketPickups = [];
    hasRocket = false;
    heartPickups = [];
    coinMultiplier = 1;
    coinMultTimer = 0;
    coinMultPickups = [];
    shopOpen = false;
    shopItems = {
      tripleShot: { cost: 50, bought: false, label: "Triple Shot 🔥", desc: "3 lasers at once" },
      speedBoost: { cost: 30, bought: false, label: "Speed Boost ⚡", desc: "Run faster" },
      superJump: { cost: 40, bought: false, label: "Super Jump 🦘", desc: "Jump higher" },
      extraLife: { cost: 25, bought: false, label: "Extra Life ❤️", desc: "+1 life (reusable)" },
    };
    // Stars for moon level
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({ x: Math.random() * GW, y: Math.random() * (GROUND_Y - 20), s: 0.5 + Math.random() * 2, b: Math.random(), sp: 0.01 + Math.random() * 0.03 });
    }
    // Generate initial platforms ahead of player
    for (let i = 0; i < 6; i++) {
      spawnPlatform(nextPlatX);
      nextPlatX += 180 + Math.random() * 160;
    }
    keys = {}; scoreEl.textContent = "0";
  }

  function spawnPlatform(wx) {
    const pw = 90 + Math.random() * 40; // width 90-130
    // Tiered heights: most platforms are low (easily reachable from ground),
    // some are medium (reachable from low platforms)
    const tier = Math.random();
    let py;
    if (tier < 0.55) {
      // Low tier — easy jump from ground (60-90px above ground)
      py = GROUND_Y - 60 - Math.random() * 30;
    } else if (tier < 0.85) {
      // Medium tier — reachable from low platforms (110-150px above ground)
      py = GROUND_Y - 110 - Math.random() * 40;
    } else {
      // High tier — needs a chain jump from medium (170-210px above ground)
      py = GROUND_Y - 170 - Math.random() * 40;
    }
    const plat = { x: wx, y: py, w: pw };
    platforms.push(plat);
    // Add a coin on top of each platform — higher platforms get better coins
    const r = Math.random();
    let ct = "gold", cv = 1;
    if (py < GROUND_Y - 150 && r < 0.5) { ct = "gem"; cv = 5; }
    else if (py < GROUND_Y - 100 && r < 0.4) { ct = "silver"; cv = 3; }
    coins.push({ x: wx, y: py - 22, type: ct, val: cv });
  }

  function showScreen(s) {
    state = s;
    startScreen.style.display = s === "start" ? "flex" : "none";
    gameoverScreen.style.display = s === "gameover" ? "flex" : "none";
    playingUI.style.display = s === "playing" ? "flex" : "none";
    container.className = s === "start" ? "start-bg" : s === "gameover" ? "gameover-bg" : "sky-bg";
    touchControls.style.display = "none";
    if (isMobile && s === "playing") showTouchHint();
    else touchHint.className = "";
    hitOverlay.style.display = "none";
    hitPause = false;
  }

  startBtn.onclick = () => { initState(); showScreen("playing"); gameLoop(); };
  retryBtn.onclick = () => { continueGame(); showScreen("playing"); gameLoop(); };
  restartBtn.onclick = () => { initState(); showScreen("playing"); gameLoop(); };
  hitContinueBtn.onclick = () => {
    hitOverlay.style.display = "none";
    const px = player.x;
    enemies = enemies.filter(e => Math.abs(e.x - px) > 150);
    enemyProjectiles = [];
    hitPause = false;
    shieldTimer = 120;
    gameLoop();
  };

  function continueGame() {
    const keepScore = score;
    const keepLevel = level;

  function shootLaser() {
    const p = player;

    if (weaponLevel >= 1) {
      lasers.push({ x: p.x + ox, y: p.y - 28, dir: dir, vy: -1.2, powered: true });
      lasers.push({ x: p.x + ox, y: p.y - 12, dir: dir, vy: 1.2, powered: true });
    } else {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir: dir, vy: 0, powered: false });
    }
    // Triple shot from shop — adds extra spread shot
    if (shopItems.tripleShot.bought) {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir: dir, vy: -2, powered: true });
      lasers.push({ x: p.x + ox, y: p.y - 20, dir: dir, vy: 2, powered: true });
    }
    if (hasRocket) {
      lasers.push({ x: p.x + ox, y: p.y - 20, dir: dir, vy: 0, rocket: true });
    }
    if (buddy) {

      lasers.push({ x: buddy.x + box, y: buddy.y - 15, dir: dir, vy: 0, powered: false, buddy: true });

    const my = (e.clientY - rect.top) * scaleY;

    if (shopOpen) {
      // Check close button
      if (mx > GW/2 - 40 && mx < GW/2 + 40 && my > 367 && my < 399) {
        shopOpen = false; gameLoop(); return;
      }
      // Check item buttons
      const items = Object.entries(shopItems);
      items.forEach(([key, item], i) => {
        const iy = 140 + i * 58;
        if (mx > GW/2 - 164 && mx < GW/2 + 164 && my > iy && my < iy + 48) {
          if (score >= item.cost && !item.bought) {
            score -= item.cost;

            // Apply item effects
            if (key === "extraLife") { lives = Math.min(lives + 1, 7); item.bought = false; }

        }
      });

    }

      shopOpen = true;
      return;
    }
  });

  let steerId = null;          // identifier of the finger currently steering

  function toGameCoords(t) {
    const rect = canvas.getBoundingClientRect();

      y: (t.clientY - rect.top) * (GH / rect.height)
    };

  function inShopButton(g) {
    return g.x > 10 && g.x < 60 && g.y > GH - 28 && g.y < GH - 6;
  }
  function triggerJump() {

    setTimeout(() => { keys["ArrowUp"] = false; }, 130);
  }
  function releaseSteering() {

  canvas.addEventListener("touchstart", e => {
    if (state !== "playing" || shopOpen) return;
    const t = e.changedTouches[0];
    const g = toGameCoords(t);
    if (inShopButton(g)) return;      // let the shop button do its job
    e.preventDefault();
    if (steerId === null) {
      steerId = t.identifier;
      steerX = g.x;
      tapStartTime = Date.now();
      tapStartX = t.clientX; tapStartY = t.clientY;

  }, { passive: false });

    if (steerId === null) return;

      e.preventDefault();

      const dx = t.clientX - tapStartX, dy = t.clientY - tapStartY;
      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) tapMoved = true;
      // flick upward = jump

        tapJumped = true;

      }

  }, { passive: false });

    if (steerId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== steerId) continue;

  function drawShopOverlay() {
    if (!shopOpen) return;

    ctx.fillRect(0, 0, GW, GH);
    // Shop panel
    const sx = GW / 2 - 180, sy = 60, sw = 360, sh = 340;
    ctx.fillStyle = "#1e1b4b";
    ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 16); ctx.fill();

    ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 16); ctx.stroke();
    // Title
    ctx.fillStyle = "#fde047"; ctx.font = "bold 22px 'Bungee', Impact, sans-serif";
    ctx.textAlign = "center"; ctx.fillText("🛒 SHOP", GW / 2, sy + 35);
    // Score display
    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 14px 'Fredoka', sans-serif";
    ctx.fillText("💰 " + score + " coins", GW / 2, sy + 58);
    // Items
    const items = Object.entries(shopItems);
    items.forEach(([key, item], i) => {
      const iy = sy + 80 + i * 58;
      const canBuy = score >= item.cost && !item.bought;
      // Item bg
      ctx.fillStyle = item.bought ? "rgba(34,197,94,0.2)" : canBuy ? "rgba(99,102,241,0.3)" : "rgba(100,100,100,0.2)";
      ctx.beginPath(); ctx.roundRect(sx + 16, iy, sw - 32, 48, 10); ctx.fill();
      // Label
      ctx.fillStyle = item.bought ? "#86efac" : "#e2e8f0";
      ctx.font = "bold 14px 'Fredoka', sans-serif"; ctx.textAlign = "left";
      ctx.fillText(item.label, sx + 28, iy + 20);
      ctx.fillStyle = "#94a3b8"; ctx.font = "12px 'Fredoka', sans-serif";
      ctx.fillText(item.desc, sx + 28, iy + 38);
      // Price / bought
      ctx.textAlign = "right";
      if (item.bought) {
        ctx.fillStyle = "#4ade80"; ctx.font = "bold 13px 'Fredoka', sans-serif";
        ctx.fillText("✓ BOUGHT", sx + sw - 28, iy + 28);
      } else {
        ctx.fillStyle = canBuy ? "#fde047" : "#64748b";
        ctx.font = "bold 14px 'Bungee', Impact, sans-serif";
        ctx.fillText(item.cost + " 💰", sx + sw - 28, iy + 28);
      }
    });
    // Close button
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.roundRect(GW / 2 - 40, sy + sh - 45, 80, 32, 10); ctx.fill();
    ctx.fillStyle = "white"; ctx.font = "bold 14px 'Bungee', Impact, sans-serif";
    ctx.textAlign = "center"; ctx.fillText("CLOSE", GW / 2, sy + sh - 24);
  }

  // === GAME LOOP ===
  function gameLoop() {
    if (state !== "playing") return;
    if (shopOpen) {
      // Render current frame + shop overlay (game paused)
      drawShopOverlay();
      return;
    }
    frame++;
    const p = player;

    // Input — apply speed boost if bought
    const baseSpd = shopItems.speedBoost.bought ? MOVE_SPEED * 1.4 : MOVE_SPEED;
    const baseAir = shopItems.speedBoost.bought ? AIR_MOVE_SPEED * 1.3 : AIR_MOVE_SPEED;
    let spd = p.ground ? baseSpd : baseAir;
    // Finger steering: walk toward the finger, speed scaled by how far away it is
    if (steerX !== null && !shopOpen) {
      const diff = steerX - (p.x - cameraX);
      const DEAD = 18, FULL = 150;
      steerMag = Math.min(1, Math.max(0, (Math.abs(diff) - DEAD) / (FULL - DEAD)));
      keys["ArrowRight"] = diff > DEAD;
      keys["ArrowLeft"] = diff < -DEAD;
    }
    if (isMobile) {
      // gentler top speed on touch, plus analog control from the drag distance
      spd *= 0.7 * (0.45 + 0.55 * steerMag);
    }
    if (keys["ArrowLeft"]) { p.x -= spd; p.right = false; }
    if (keys["ArrowRight"]) { p.x += spd; p.right = true; }
    // Apply super jump if bought
    const jf = shopItems.superJump.bought ? JUMP_FORCE * 1.25 : JUMP_FORCE;
    if (keys["ArrowUp"] && p.ground) { p.vy = jf; p.ground = false; }

    // Physics
    p.vy += GRAVITY; p.y += p.vy;
    if (p.y >= GROUND_Y) { p.y = GROUND_Y; p.vy = 0; p.ground = true; }

    // Cloud platform collision — only when falling down
    if (p.vy >= 0) {
      for (const pl of platforms) {
        const hw = pl.w / 2;
        // Check if player feet are at platform level and within horizontal bounds
        const feetY = p.y + 36; // feet position
        const prevFeetY = feetY - p.vy;
        if (p.x > pl.x - hw - 10 && p.x < pl.x + hw + 10 &&
            prevFeetY <= pl.y + 6 && feetY >= pl.y - 2) {
          p.y = pl.y - 36; // land on platform
          p.vy = 0;
          p.ground = true;
        }
      }
    }

    // Spawn new platforms ahead as player moves
    while (nextPlatX < cameraX + GW + 400) {
      spawnPlatform(nextPlatX);
      nextPlatX += 180 + Math.random() * 160;
    }
    // Remove platforms far behind camera
    platforms = platforms.filter(pl => pl.x > cameraX - 300);

    // Camera smooth follow
    const targetCam = p.x - GW * 0.35;
    cameraX += (targetCam - cameraX) * 0.1;

    const psx = p.x - cameraX; // player screen x

    // Hold-to-fire (keyboard space)
    if (keys[" "] && state === "playing" && !shopOpen) {
      shootCooldown++;
      if (shootCooldown >= 14) { shootCooldown = 0; shootLaser(); }
    } else { shootCooldown = 0; }

    // Lasers
    lasers = lasers.filter(l => {
      const spd = l.rocket ? 7 : LASER_SPEED;
      l.x += spd * l.dir; l.y += (l.vy || 0);
      const sx=l.x-cameraX; return sx>-40 && sx<GW+40 && l.y > -20 && l.y < GH+20;
    });

    // *** DIFFICULTY CURVE ***
    // Level 1: 150 down to 90. Level 2: 90 down to 70. Level 3: stays around 80 — bosses add the challenge
    let spawnRate;
    if (level === 1) {
      spawnRate = Math.max(90, 150 - score * 0.6);
    } else if (level === 2) {
      spawnRate = Math.max(70, 110 - (score - LEVEL2_SCORE) * 0.3);
    } else if (level === 3) {
      spawnRate = 80;
    } else {
      spawnRate = 75; // level 4 — steady with bosses
    }
    spawnTimer++;
    if (spawnTimer >= spawnRate) {
      spawnTimer = 0;
      const fromR = Math.random() > 0.5;
      const spX = fromR ? (cameraX + GW + 40) : (cameraX - 40);
      // Speed: capped more gently
      const spdCap = level >= 3 ? 1.5 : 2.0;
      const spd = (1.0 + Math.random() * 1.0 + Math.min(score * 0.008, spdCap)) * (fromR ? -1 : 1);
      enemies.push({ x: spX, y: GROUND_Y - 4, speed: spd, ci: Math.floor(Math.random()*3), v: Math.floor(Math.random()*2) });
    }

    // Coins — different types based on level
    coinTimer++;
    if (coinTimer >= 80) {
      coinTimer = 0;
      const r = Math.random();
      let coinType = "gold", coinVal = 1;
      if (level >= 2 && r < 0.15) { coinType = "gem"; coinVal = 5; }
      else if (level >= 2 && r < 0.35) { coinType = "silver"; coinVal = 3; }
      coins.push({ x: cameraX + 50 + Math.random() * (GW - 100), y: GROUND_Y - 30 - Math.random() * 100, type: coinType, val: coinVal });
    }

    // Weapon powerup spawning — only if not yet collected
    if (weaponLevel === 0 && frame % 600 === 0 && Math.random() < 0.4 && powerups.length < 2) {
      powerups.push({
        x: cameraX + GW * 0.5 + Math.random() * GW * 0.4,
        y: GROUND_Y - 50 - Math.random() * 80,
        bobPhase: Math.random() * Math.PI * 2
      });
    }

    // Weapon is permanent once collected — no timer countdown

    // Player-powerup collision
    powerups = powerups.filter(pw => {
      if (Math.abs(p.x - pw.x) < 30 && Math.abs(p.y - pw.y) < 40) {
        weaponLevel = 1;
        return false;
      }
      return pw.x > cameraX - 200;
    });

    // Buddy alien spawning — spawns every ~900 frames if no active buddy/shield
    if (shieldTimer <= 0 && !buddy && frame % 900 === 0 && Math.random() < 0.5 && buddyAliens.length < 1) {
      buddyAliens.push({
        x: cameraX + GW * 0.6 + Math.random() * GW * 0.3,
        y: GROUND_Y - 10
      });
    }

    // Shield timer countdown
    if (shieldTimer > 0) {
      shieldTimer--;
      if (shieldTimer <= 0) { buddy = null; }
    }

    // Player-buddy collision — pick up buddy
    buddyAliens = buddyAliens.filter(ba => {
      if (Math.abs(p.x - ba.x) < 35 && Math.abs(p.y - ba.y) < 40) {
        buddy = { x: p.x - 30, y: p.y }; // start following
        shieldTimer = SHIELD_DURATION;
        return false;
      }
      return ba.x > cameraX - 200;
    });

    // Buddy follows player smoothly
    if (buddy) {
      const targetBX = p.x - (p.right ? 35 : -35);
      const targetBY = p.y;
      buddy.x += (targetBX - buddy.x) * 0.12;
      buddy.y += (targetBY - buddy.y) * 0.15;
    }

    // Move enemies
    enemies = enemies.filter(e => {
      // Boss behavior — stops to shoot
      if (e.boss) {
        e.shootTimer = (e.shootTimer || 0) + 1;
        if (e.shootTimer >= 90) { // shoot every 1.5 sec
          e.shootTimer = 0;
          // Fire projectile toward player
          const dx = p.x - e.x;
          const projDir = dx > 0 ? 1 : -1;
          enemyProjectiles.push({ x: e.x, y: e.y - 10, vx: projDir * 4, vy: -1.5 });
        }
        // Boss moves slower
        e.x += e.speed * 0.5;
      } else {
        e.x += e.speed;
      }
      const sx=e.x-cameraX; return sx>-120 && sx<GW+120;
    });

    // Boss spawning (level 3+) — first one appears quickly
    if (level >= 3) {
      bossSpawnTimer++;
      const bossRate = bossSpawnTimer < 120 ? 120 : 350; // first boss at 2 sec, then every ~5.8 sec
      if (bossSpawnTimer >= bossRate) {
        bossSpawnTimer = 0;
        const fromR = Math.random() > 0.5;
        const spX = fromR ? (cameraX + GW + 60) : (cameraX - 60);
        const spd = (0.8 + Math.random() * 0.6) * (fromR ? -1 : 1);
        enemies.push({ x: spX, y: GROUND_Y - 20, speed: spd, ci: 0, v: 0, boss: true, hp: BOSS_HP, shootTimer: 0 });
      }
    }

    // Enemy projectiles movement
    enemyProjectiles = enemyProjectiles.filter(ep => {
      ep.x += ep.vx;
      ep.y += ep.vy;
      ep.vy += 0.06; // slight gravity arc
      const sx = ep.x - cameraX;
      return sx > -40 && sx < GW + 40 && ep.y < GH;
    });

    // Player hit by enemy projectile
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const ep = enemyProjectiles[i];
      if (Math.abs(p.x - ep.x) < 20 && Math.abs(p.y - ep.y) < 30) {
        if (shieldTimer <= 0) {
          enemyProjectiles.splice(i, 1);
          lives--;
          explosions.push({ x: p.x - cameraX, y: p.y, sf: frame });
          if (lives > 0) {
            hitPause = true;
            hitHearts.textContent = "❤️".repeat(lives) + "🖤".repeat(5 - lives);
            hitOverlay.style.display = "flex";
            return;
          } else {
            finalScoreEl.textContent = score;
            gameoverTitle.textContent = "GAME OVER";
            livesDisplay.textContent = "🖤🖤🖤🖤🖤";
            gameoverMsg.textContent = "!כל הכבוד דוידי 🛸";
            retryBtn.style.display = "none";
            restartBtn.style.display = "inline-block";
            showScreen("gameover");
            return;
          }
        } else {
          enemyProjectiles.splice(i, 1); // shield absorbs
        }
      }
    }

    // Rocket pickup spawning (level 3, if not collected) — appears quickly
    if (level >= 3 && !hasRocket) {
      if (rocketPickups.length < 1 && (frame % 400 === 0 || (frame > 10 && rocketPickups.length === 0 && !hasRocket && bossSpawnTimer < 150))) {
        rocketPickups.push({
          x: cameraX + GW * 0.4 + Math.random() * GW * 0.3,
          y: GROUND_Y - 40 - Math.random() * 60
        });
      }
    }

    // Player-rocket pickup
    rocketPickups = rocketPickups.filter(rp => {
      if (Math.abs(p.x - rp.x) < 30 && Math.abs(p.y - rp.y) < 40) {
        hasRocket = true;
        return false;
      }
      return rp.x > cameraX - 200;
    });

    // Heart pickup spawning — every ~1000 frames, if lives < 5
    if (lives < 5 && frame % 1000 === 0 && Math.random() < 0.5 && heartPickups.length < 1) {
      heartPickups.push({
        x: cameraX + GW * 0.3 + Math.random() * GW * 0.4,
        y: GROUND_Y - 40 - Math.random() * 80
      });
    }

    // Player-heart pickup
    heartPickups = heartPickups.filter(hp => {
      if (Math.abs(p.x - hp.x) < 28 && Math.abs(p.y - hp.y) < 38) {
        lives = Math.min(lives + 1, 5);
        return false;
      }
      return hp.x > cameraX - 200;
    });

    // x2 coin multiplier spawning — every ~800 frames
    if (coinMultiplier <= 1 && frame % 800 === 0 && Math.random() < 0.4 && coinMultPickups.length < 1) {
      coinMultPickups.push({
        x: cameraX + GW * 0.4 + Math.random() * GW * 0.3,
        y: GROUND_Y - 30 - Math.random() * 70
      });
    }

    // Player-coinMult pickup
    coinMultPickups = coinMultPickups.filter(cm => {
      if (Math.abs(p.x - cm.x) < 28 && Math.abs(p.y - cm.y) < 38) {
        coinMultiplier = 2;
        coinMultTimer = 900; // 15 seconds
        return false;
      }
      return cm.x > cameraX - 200;
    });

    // Coin multiplier timer
    if (coinMultTimer > 0) {
      coinMultTimer--;
      if (coinMultTimer <= 0) coinMultiplier = 1;
    }

    // Laser-enemy collisions
    lasers = lasers.filter(l => {
      let hit = false;
      enemies = enemies.filter(e => {
        const hitDist = e.boss ? 30 : 24;
        const hitDistY = e.boss ? 50 : 30;
        if (Math.abs(l.x - e.x) < hitDist && Math.abs(l.y - e.y) < hitDistY) {
          hit = true;
          if (e.boss) {
            // Rocket kills boss instantly
            if (l.rocket) {
              score += 10; scoreEl.textContent = score;
              explosions.push({ x: e.x - cameraX, y: e.y, sf: frame, big: true });
              return false; // boss dead
            }
            // Normal/powered laser: reduce HP
            e.hp--;
            if (e.hp <= 0) {
              score += 10; scoreEl.textContent = score;
              explosions.push({ x: e.x - cameraX, y: e.y, sf: frame, big: true });
              return false;
            }
            // Boss survives — laser consumed but boss stays
            return true;
          } else {
            // Normal enemy
            score += 5; scoreEl.textContent = score;
            explosions.push({ x: e.x - cameraX, y: e.y, sf: frame });
            return false;
          }
        }
        return true;
      });
      return !hit;
    });

    // Player-coin — check against player center body
    coins = coins.filter(c => {
      if (Math.abs(p.x - c.x) < 30 && Math.abs(p.y - c.y) < 45) {
        score += (c.val || 1) * coinMultiplier; scoreEl.textContent = score; return false;
      }
      return true;
    });

    // Level transition check
    if (level === 1 && score >= LEVEL2_SCORE && !levelTransition) {
      levelTransition = true;
      transitionFrame = 0;
    }
    if (level === 2 && score >= LEVEL3_SCORE && !levelTransition) {
      levelTransition = true;
      transitionFrame = 0;
    }
    if (level === 3 && score >= LEVEL4_SCORE && !levelTransition) {
      levelTransition = true;
      transitionFrame = 0;
    }
    if (levelTransition) {
      transitionFrame++;
      if (transitionFrame >= 120) {
        if (level === 1) level = 2;
        else if (level === 2) level = 3;
        else if (level === 3) level = 4;
        levelTransition = false;
        enemies = [];
        buddyAliens = [];
        enemyProjectiles = [];
      }
    }

    // Player-enemy
    let playerHit = false;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (Math.abs(p.x - e.x) < 28 && Math.abs(p.y - e.y) < 36) {
        if (shieldTimer > 0) {
          score += 3; scoreEl.textContent = score;
          explosions.push({ x: e.x - cameraX, y: e.y, sf: frame });
          enemies.splice(i, 1);
        } else {
          lives--;
          explosions.push({ x: p.x - cameraX, y: p.y, sf: frame });
          enemies.splice(i, 1);
          playerHit = true;
          break;
        }
      }
    }

    // Clouds (only level 1)
    if (level === 1) clouds.forEach(c => { c.x += c.sp; if (c.x > GW + 60) c.x = -60; });
    // Explosions cleanup
    explosions = explosions.filter(e => (frame - e.sf) < (e.big ? 35 : 20));

    // === RENDER ===
    if (level === 1) {
      drawSky();
      drawSun();
      clouds.forEach(c => drawCloud(c.x, c.y, c.s));
      drawHills();
      TREE_DEFS.forEach(t => drawTree(wrapX(t.o, 0.7), t.v));
      drawGround();
    } else if (level === 4) {
      drawDeepSpaceSky();
      drawSpaceGround();
    } else {
      drawMoonSky();
      drawEarth();
      drawMoonHills();
      drawGround();
    }
    // Platforms by level
    platforms.forEach(pl => {
      const sx = pl.x - cameraX;
      if (sx > -100 && sx < GW + 100) {
        if (level === 4) drawSpacePlatform(sx, pl.y, pl.w);
        else if (level >= 2) drawMoonPlatform(sx, pl.y, pl.w);
        else drawPlatformCloud(sx, pl.y, pl.w);
      }
    });
    coins.forEach(c => drawCoin(c.x - cameraX, c.y, c.type));
    powerups.forEach(pw => { const sx=pw.x-cameraX; if(sx>-40&&sx<GW+40) drawPowerup(sx, pw.y, pw.bobPhase); });
    buddyAliens.forEach(ba => { const sx=ba.x-cameraX; if(sx>-40&&sx<GW+40) drawBuddyPickup(sx, ba.y); });
    rocketPickups.forEach(rp => { const sx=rp.x-cameraX; if(sx>-40&&sx<GW+40) drawRocketPickup(sx, rp.y); });
    heartPickups.forEach(hp => { const sx=hp.x-cameraX; if(sx>-40&&sx<GW+40) drawHeartPickup(sx, hp.y); });
    coinMultPickups.forEach(cm => { const sx=cm.x-cameraX; if(sx>-40&&sx<GW+40) drawCoinMultPickup(sx, cm.y); });
    // Enemies — boss, space, or regular
    enemies.forEach(e => {
      const sx = e.x - cameraX;
      if (e.boss) drawBossAlien(sx, e.y, e.hp);
      else if (level === 4) drawSpaceEnemy(sx, e.y, e.v);
      else drawEnemy(sx, e.y, e.ci, e.v);
    });
    enemyProjectiles.forEach(ep => { const sx=ep.x-cameraX; drawEnemyProjectile(sx, ep.y); });
    lasers.forEach(l => {
      const sx = l.x - cameraX;
      if (l.rocket) drawRocket(sx, l.y, l.dir);
      else drawLaser(sx, l.y, l.powered, l.buddy);
    });
    explosions.forEach(e => {
      if (e.big) drawBigExplosion(e);
      else drawExplosion(e);
    });
    if (shieldTimer > 0) drawShieldBubble(psx, p.y);
    drawAlien(psx, p.y, p.right, !p.ground);
    if (buddy) drawBuddyAlien(buddy.x - cameraX, buddy.y, p.right);
    drawWeaponIndicator();
    drawShieldIndicator();
    drawCoinMultIndicator();
    drawLevelIndicator();
    drawShopButton();
    // Lives (hearts) display — top left corner
    for (let i = 0; i < 5; i++) {
      const hx = 22 + i * 24;
      if (i < lives) {
        // Full heart
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(hx, 18);
        ctx.bezierCurveTo(hx, 14, hx - 7, 10, hx - 7, 15);
        ctx.bezierCurveTo(hx - 7, 19, hx, 23, hx, 26);
        ctx.bezierCurveTo(hx, 23, hx + 7, 19, hx + 7, 15);
        ctx.bezierCurveTo(hx + 7, 10, hx, 14, hx, 18);
        ctx.fill();
      } else {
        // Empty heart
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(hx, 18);
        ctx.bezierCurveTo(hx, 14, hx - 7, 10, hx - 7, 15);
        ctx.bezierCurveTo(hx - 7, 19, hx, 23, hx, 26);
        ctx.bezierCurveTo(hx, 23, hx + 7, 19, hx + 7, 15);
        ctx.bezierCurveTo(hx + 7, 10, hx, 14, hx, 18);
        ctx.stroke();
      }
    }
    // Level transition overlay
    if (levelTransition) drawLevelTransition();

    // Hit pause — darken canvas and stop loop
    if (playerHit) {
      // Draw darkened overlay on canvas
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, GW, GH);
      if (lives > 0) {
        hitPause = true;
        hitHearts.textContent = "❤️".repeat(lives) + "🖤".repeat(5 - lives);
        hitOverlay.style.display = "flex";
        return; // stop loop, wait for continue
      } else {
        finalScoreEl.textContent = score;
        gameoverTitle.textContent = "GAME OVER";
        livesDisplay.textContent = "🖤🖤🖤🖤🖤";
        gameoverMsg.textContent = "!כל הכבוד דוידי 🛸";
        retryBtn.style.display = "none";
        restartBtn.style.display = "inline-block";
        showScreen("gameover");
        return;
      }
    }

    requestAnimationFrame(gameLoop);
  }

  // Resize canvas — on touch devices the playfield fills the whole screen
  let rotateDismissed = false;
  const rotateScreen = document.getElementById("rotate-screen");
  document.getElementById("rotate-anyway").addEventListener("click", () => {
    rotateDismissed = true;
    rotateScreen.classList.remove("show");
    resizeCanvas();
  });

  function targetGW() {
    if (!isMobile) return 800;
    const ar = window.innerWidth / window.innerHeight;
    if (ar < 1) return 800;                       // portrait — keep the standard world
    return Math.max(800, Math.min(1200, Math.round(GH * ar)));
  }

  function resizeCanvas() {
    const gw = targetGW();
    if (gw !== GW) { GW = gw; canvas.width = GW; }

    if (isMobile) {
      const portrait = window.innerWidth < window.innerHeight;
      rotateScreen.classList.toggle("show", portrait && !rotateDismissed);
      const scale = Math.min(window.innerWidth / GW, window.innerHeight / GH);
      canvas.style.width = (GW * scale) + "px";
      canvas.style.height = (GH * scale) + "px";
    } else {
      const scale = Math.min((window.innerWidth - 8) / GW, (window.innerHeight - 120) / GH, 1);
      canvas.style.width = (GW * scale) + "px";
      canvas.style.height = (GH * scale) + "px";
    }
  }
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 250));
  resizeCanvas();

  showScreen("start");
})();
</script>
</body>
</html>
